name: release
# Tag v<semver> on main -> test, build static binaries + .deb + .rpm + tarball for x86_64 and
# aarch64, install-test every artifact in containers (Debian, Ubuntu, Fedora, openSUSE, Arch,
# Alpine), then publish them with SHA256SUMS, a keyless Sigstore signature and SLSA build
# provenance. No long-lived signing key exists anywhere. Builds are reproducible via
# SOURCE_DATE_EPOCH from the tagged commit (see docs/RELEASING.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/ci-deps.sh
      - name: tag matches the workspace version
        run: |
          v=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME%%-*}" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - run: cargo xtask build-bpf
      - run: cargo test --workspace
      - run: ./scripts/priv-test.sh

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - run: ./scripts/ci-deps.sh && sudo apt-get install -y -qq musl-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      # SR-7: one timestamp for every asset in this job, taken from the tagged commit rather
      # than the wall clock. cargo-deb, cargo-generate-rpm and tar all honour this environment.
      - name: reproducible build timestamp
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: static binaries
        run: cargo build --release --locked --target "$TARGET" -p kavachd -p kavachctl -p kavach-gateway
      - name: smoke-test the binaries
        run: |
          for bin in kavachd kavachctl kavach-gateway; do
            file target/$TARGET/release/$bin | grep -q 'static'
            target/$TARGET/release/$bin --version
          done
          target/$TARGET/release/kavachctl doctor || true
          target/$TARGET/release/kavachctl compile examples/kavach.toml
      - name: .deb
        run: cargo deb -p kavachd --no-build --target "$TARGET" -o dist/
      - name: .rpm
        run: cargo generate-rpm -p crates/kavachd --target "$TARGET" -o dist/
      - name: tarball
        run: |
          v=${GITHUB_REF_NAME#v}
          d=kavach-$v-${{ matrix.arch }}-linux-musl
          mkdir -p "$d/bin" "$d/etc" "$d/systemd" "$d/doc/examples"
          cp target/$TARGET/release/kavachd target/$TARGET/release/kavachctl \
             target/$TARGET/release/kavach-gateway "$d/bin/"
          cp examples/kavachd.toml "$d/etc/"
          cp packaging/systemd/kavachd.service "$d/systemd/"
          cp packaging/install.sh "$d/"
          cp README.md CHANGELOG.md docs/INSTALL.md docs/ARCHITECTURE.md LICENSE* "$d/doc/" 2>/dev/null || true
          cp -r LICENSES "$d/doc/"
          cp examples/kavach.toml "$d/doc/examples/"
          tar --owner=0 --group=0 --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --format=gnu -czf "dist/$d.tar.gz" "$d"
      - name: install-test the .deb
        run: |
          sudo apt-get install -y ./dist/*.deb
          kavachd --version
          kavachctl --version
          kavach-gateway --version
          systemctl cat kavachd >/dev/null
          sudo test -f /etc/kavach/kavachd.toml       # /etc/kavach is 0750 root on purpose
          [ "$(sudo stat -c %a /etc/kavach)" = 750 ]
          sudo apt-get remove -y kavach
          test ! -e /usr/bin/kavachctl && test ! -e /usr/bin/kavachd
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  install-test:
    # Install each artifact in a real container: binaries, service definition, config, removal.
    # Arch and Alpine build the native packages from the static tarball via the shipped
    # PKGBUILD / APKBUILD, which is the same path a user takes.
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: debian }
          - { distro: ubuntu }
          - { distro: fedora }
          - { distro: opensuse }
          - { distro: arch }
          - { distro: alpine }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: native manifests and checksums for the container tests
        run: |
          # The release is not published yet, so the Arch/Alpine manifests verify their
          # tarball against a checksum list generated here (the publish job makes its own).
          cp packaging/arch/PKGBUILD packaging/arch/kavach.install \
             packaging/alpine/APKBUILD packaging/alpine/kavachd.initd dist/
          cd dist
          for f in *; do
            case "$f" in SHA256SUMS*) continue ;; esac
            sha256sum "$f"
          done > SHA256SUMS
      - name: install / verify / remove (${{ matrix.distro }})
        run: |
          v=${GITHUB_REF_NAME#v}; v=${v%%-*}
          KAVACH_VERSION="$v" ./scripts/install-test.sh "${{ matrix.distro }}" dist

  publish:
    needs: [build, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release
      id-token: write       # Sigstore keyless + attestations
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: native package manifests (ships as release assets too)
        run: |
          cp packaging/arch/PKGBUILD packaging/arch/kavach.install \
             packaging/alpine/APKBUILD packaging/alpine/kavachd.initd dist/
      - name: checksums (exclude the checksum list and its signature)
        run: |
          cd dist
          for f in *; do
            case "$f" in SHA256SUMS*) continue ;; esac
            sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: sigstore/cosign-installer@v3
      - name: sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: verify what we just signed
        run: |
          cosign verify-blob dist/SHA256SUMS --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          v=${GITHUB_REF_NAME#v}; v=${v%%-*}
          {
            # this version's CHANGELOG section (without its heading)
            awk -v v="$v" '/^## \[/{f = index($0, "[" v "]") > 0; next} /^\[[0-9]/{f=0} f' CHANGELOG.md
            echo
            echo "## Install"
            echo
            echo "Install: see [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALL.md)."
            echo
            echo '```sh'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* $pre --verify-tag \
            --title "Kavach $GITHUB_REF_NAME" --notes-file notes.md
