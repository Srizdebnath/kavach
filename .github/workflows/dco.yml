name: dco
on:
  pull_request:
permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit carries a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in
              *"[bot]@users.noreply.github.com>") echo "skip bot commit $c ($author)"; continue ;;
            esac
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" \
                | grep -Eq '^.+ <[^>]+@[^>]+>$'; then
              echo "ok   $c"
            else
              echo "::error::commit $c by $author has no Signed-off-by line"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign off with 'git commit -s'; fix existing commits with"
            echo "'git rebase --signoff $BASE' and force-push. See CONTRIBUTING.md."
            exit 1
          fi
