name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: toolchain for the eBPF object
        run: ./scripts/ci-deps.sh
      - run: cargo fmt --all --check
      - run: cargo xtask codegen --check
      - run: cargo clippy --workspace --all-targets
      - name: no_std crates build for a bare-metal target
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build -p kavach-common -p kavach-core --target thumbv7em-none-eabihf

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-deps.sh
      - run: cargo xtask build-bpf
      - run: cargo test --workspace
      - name: verifier + BPF_PROG_TEST_RUN suite (real kernel, root)
        run: ./scripts/priv-test.sh

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
