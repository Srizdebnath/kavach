name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: toolchain for the eBPF object
        run: ./scripts/ci-deps.sh
      - run: cargo fmt --all --check
      - run: cargo xtask codegen --check
      - run: cargo clippy --workspace --all-targets
      - name: no_std crates build for a bare-metal target
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo build -p kavach-common -p kavach-core -p kavach-parsers --target thumbv7em-none-eabihf

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/ci-deps.sh
      - run: cargo xtask build-bpf
      - run: cargo test --workspace
      - name: verifier + BPF_PROG_TEST_RUN suite (real kernel, root)
        run: ./scripts/priv-test.sh
      - name: perf gate (kernel-measured ns/packet + verifier instruction budget)
        run: |
          bin=$(cargo test -p kavachd --test bpf --no-run --message-format=json 2>/dev/null \
            | grep -o '"executable":"[^"]*/bpf-[0-9a-f]*"' | tail -1 | cut -d'"' -f4)
          sudo env KAVACH_BENCH_OUT="$PWD/bench.json" "$bin" --ignored --test-threads=1 bench_report
          ./scripts/perf-gate.py bench.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: bench.json
          if-no-files-found: ignore

  miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test -p kavach-common -p kavach-core -p kavach-parsers
        env:
          PROPTEST_CASES: "4"
          PROPTEST_DISABLE_FAILURE_PERSISTENCE: "1"
          MIRIFLAGS: -Zmiri-disable-isolation

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
