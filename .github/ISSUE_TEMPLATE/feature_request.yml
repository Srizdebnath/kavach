name: Feature request
description: Suggest a new capability or a change in behaviour.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like Kavach to do. Example policy snippets are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kernel programs (XDP / TC / BPF-LSM)
        - Daemon (kavachd)
        - CLI (kavachctl)
        - Policy language / signed bundles
        - L7 gateway / parsers
        - Packaging / install
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
          required: false
