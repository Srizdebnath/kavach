[package]
name = "kavach-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0 OR MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kavach-parsers = { path = "../crates/kavach-parsers" }
kavach-policy = { path = "../crates/kavach-policy" }
kavach-api = { path = "../crates/kavach-api" }
kavach-gateway = { path = "../crates/kavach-gateway" }
serde_json = "1"

[workspace]

[[bin]]
name = "tls_client_hello"
path = "fuzz_targets/tls_client_hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_compile"
path = "fuzz_targets/policy_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_verify"
path = "fuzz_targets/bundle_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control_request"
path = "fuzz_targets/control_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quic_initial"
path = "fuzz_targets/quic_initial.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_framing"
path = "fuzz_targets/gateway_framing.rs"
test = false
doc = false
bench = false
