[workspace]
resolver = "3"
members = [
    "crates/kavach-common",
    "crates/kavach-core",
    "crates/kavach-parsers",
    "crates/kavach-gateway",
    "crates/kavach-policy",
    "crates/kavach-api",
    "crates/kavachd",
    "crates/kavachctl",
    "xtask",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Srizdebnath/kavach"
authors = ["The Kavach Authors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "warn"

[workspace.dependencies]
kavach-common = { path = "crates/kavach-common", version = "0.3.1" }
kavach-core = { path = "crates/kavach-core", version = "0.3.1" }
kavach-policy = { path = "crates/kavach-policy", version = "0.3.1" }
kavach-api = { path = "crates/kavach-api", version = "0.3.1" }
kavach-gateway = { path = "crates/kavach-gateway", version = "0.3.1" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
postcard = { version = "1", features = ["alloc"] }
ipnet = { version = "2", features = ["serde"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
proptest = "1"
aya = "0.16"
getrandom = "0.3"

# Hashing executables in an unoptimised build is ~30x slower and stalls classification.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
