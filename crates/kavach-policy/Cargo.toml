[package]
name = "kavach-policy"
description = "kavach.toml -> validated IR -> compiled tables -> ed25519-signed bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kavach-common = { workspace = true, features = ["std"] }
kavach-core = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
postcard = { workspace = true }
ipnet = { workspace = true }
getrandom = { workspace = true }
hex = "0.4"
# `gateway`: conversions into `kavach_gateway::ToolPolicy` (kavachd, kavachctl).
kavach-gateway = { workspace = true, optional = true }

[features]
gateway = ["dep:kavach-gateway"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
