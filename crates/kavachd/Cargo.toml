[package]
name = "kavachd"
description = "Kavach host daemon: loads and pins the eBPF programs, applies signed policy, brokers identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kavach-common = { workspace = true, features = ["aya", "std"] }
kavach-core = { workspace = true }
kavach-policy = { workspace = true }
kavach-api = { workspace = true }
aya = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
hex = "0.4"
ipnet = { workspace = true }
postcard = { workspace = true }
nix = { version = "0.30", features = ["sched", "time", "user", "fs", "socket", "inotify"] }
bytemuck = { workspace = true }

[dev-dependencies]
tempfile = "3"
hex = "0.4"

[lints]
workspace = true
