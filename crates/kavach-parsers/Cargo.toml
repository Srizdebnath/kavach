[package]
name = "kavach-parsers"
description = "no_std, allocation-free parsers for attacker-controlled bytes: TLS ClientHello (SNI/ALPN/JA4), QUIC Initial and DNS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["quic"]
# QUIC Initial decryption (RFC 9001 / RFC 9369). Pulls in RustCrypto HKDF, AES and AES-GCM, all
# no_std and allocation-free.
quic = ["dep:hkdf", "dep:aes", "dep:aes-gcm"]

[dependencies]
sha2 = { version = "0.11", default-features = false }
hkdf = { version = "0.12", default-features = false, optional = true }
aes = { version = "0.8", default-features = false, optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"], optional = true }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
