# /etc/kavach/kavachd.toml — host configuration for kavachd (policy itself comes in signed bundles).

# Interfaces for XDP (blocklist + rate limit) and TC (flow tracking + ingress policy).
interfaces = ["auto"]       # "auto" = interfaces with a default route; or list them, e.g. ["eth0"]
xdp_mode   = "auto"          # auto | native | generic
tc         = true
lsm        = true            # identity-aware egress (needs `bpf` in /sys/kernel/security/lsm)

trusted_keys_dir = "/etc/kavach/trusted_keys"   # *.pub, hex or raw ed25519
revoked_keys     = []                           # hex key ids (first 8 bytes of SHA-256(pk))
fleet            = "default"

# Members of this group may use read/operate commands; kill-switch stays root-only.
# control_group = "kavach"

sample_rate = 64            # 1-in-N verdict events to the ring buffer (0 = off)

# Executables hashed ahead of time when the policy names binaries by sha256 (non-recursive,
# watched with inotify). Default: the standard bin/sbin/libexec directories.
# hash_scan_dirs = ["/usr/bin", "/usr/sbin", "/usr/local/bin", "/usr/local/sbin", "/usr/libexec"]

[ratelimit]                 # per-source GCRA at XDP; IPv6 sources share a /64 budget
pps   = 20000
burst = 40000

# Per-identity anomaly detection (detection only: never changes a verdict). Identity is
# (uid, cgroup, comm). Each identity's egress drop/log events are counted per window and compared
# with an EWMA baseline. Metrics: conn_rate, deny_rate, distinct_dsts, new_dst_ports. Detections
# show up as `anomaly` events in `kavachctl events` and as audit records. Only events the kernel
# already reports are used, so this adds no kernel work. Memory is capped at about 400 B per
# identity (max 1024 identities, least recently seen evicted).
[anomaly]
enabled          = true
window_secs      = 60
learning_windows = 30       # windows before an identity can alert (30 min)
alpha            = 0.1      # EWMA weight of the newest window
z_threshold      = 4.0      # (x - mean) / sigma, with sigma >= sqrt(mean) and >= 1
ratio_threshold  = 3.0      # and x >= ratio * mean
min_count        = 10       # and x >= this (conn_rate, deny_rate, distinct_dsts)
min_new_ports    = 3        # floor for new_dst_ports
cooldown_secs    = 600      # per identity and metric
max_identities   = 1024

# L7 gateway (v0.4 preview). With `enabled = true`, a TCP connect that an egress rule punts is
# redirected to the gateway listener (cgroup connect hooks on the root cgroup v2; needs the BPF
# LSM). While nothing listens on `listen`, punts resolve through the rule's fail mode as before
# (kavachd renews a liveness deadline only while the listener is up). UDP/ICMP punts always use
# the fail mode.
[gateway]
enabled = false
listen  = "127.0.0.1:15001"   # loopback only
# listen6       = "[::1]:15001"   # else IPv6 sockets go to ::ffff:<listen> (v6-only ones cannot)
# exempt_cgroup = "/sys/fs/cgroup/system.slice/kavach-gateway.service"  # out-of-process gateway
# kavachd runs the L7 proxy itself on `listen` (it is exempt from redirection: no loops) and
# writes its decisions to the audit log (every deny; allows sampled at 10/s).
# [gateway.proxy]
# max_connections = 1024
# idle_timeout_ms = 300000

# Optional AF_XDP RX backend (not part of the punt path). OFF unless enabled: a redirected
# queue depends on the gateway process, so only the listed ports are redirected (everything else,
# SSH included, stays on the kernel stack) and a watchdog detaches a queue whose consumer stalls.
# Redirected frames bypass TC ingress policy (XDP blocklist and rate limit still apply), and they
# are consumed (counted, then dropped) in user space: AF_XDP cannot hand a frame back to the
# kernel stack, so only list ports nothing else on this host must receive.
# [gateway.afxdp]
# enabled     = false
# iface       = "eth0"        # must be one of `interfaces` (needs the Kavach XDP program)
# queues      = [0]           # RX queue ids, opted in one by one
# ports       = [8443]        # 8443 = 8443/tcp; also "443/udp"
# watchdog_ms = 250           # detach a queue whose fill ring stalls this long with frames waiting

# k8s-label / SPIFFE identity node agent (v0.4). OFF unless enabled; hosts without Kubernetes
# need nothing here. Maps each pod's cgroup (cgroup v2 only) to its labels, namespace and service
# account, so `who = { k8s = "app=db" }` / `who = { spiffe = "spiffe://..." }` rules match it.
# Pods whose metadata is not known yet are "identity unknown": fail-closed workload rules refuse
# them, fail-open ones skip them. kavachd must see the host's cgroup tree (host cgroup namespace).
# [k8s]
# enabled         = false
# source          = "apiserver"   # apiserver (RBAC: pods list) | kubelet (nodes/proxy get) | file
# node_name       = ""            # default: $NODE_NAME, else the hostname
# trust_domain    = "cluster.local"
# spiffe_template = "spiffe://{trust_domain}/ns/{namespace}/sa/{service_account}"
# api_server      = ""            # default (in a pod): https://$KUBERNETES_SERVICE_HOST:$..._PORT
# kubelet_url     = ""            # default: https://<node_name>:10250
# token_file      = "/var/run/secrets/kubernetes.io/serviceaccount/token"   # re-read per request
# ca_file         = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
# pods_file       = ""            # source = "file": a PodList JSON (kubectl get pods -o json)
# cgroup_root     = "/sys/fs/cgroup"
# resync_secs     = 30            # full re-list (label changes); new pods are listed at once
# scan_ms         = 500           # cgroupfs scan interval
