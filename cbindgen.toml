# cbindgen config for bpf/include/kavach_abi.h — run `cargo xtask codegen`.
language = "C"
include_guard = "KAVACH_ABI_H"
no_includes = true
sys_includes = []
autogen_warning = "/* GENERATED by `cargo xtask codegen` from crates/kavach-common/src/abi.rs. DO NOT EDIT. */"
style = "tag"
cpp_compat = false
usize_is_size_t = false

[export]
include = ["FlowKey","FlowVal","BlockKey","BlockVal","SrcKey","RateState","XdpConfig","ClassVal","ExeKey","ExeClass","KeyReq","Identity","PolicyHeader","Rule","Policy","AddrKey","Event","GatewayCfg","PuntRecord","OrigKey","Verdict","StatReason","EventKind"]
exclude = ["LAYOUT"]

[export.rename]
"FlowKey" = "kv_flow_key"
"FlowVal" = "kv_flow_val"
"BlockKey" = "kv_block_key"
"BlockVal" = "kv_block_val"
"SrcKey" = "kv_src_key"
"RateState" = "kv_rate_state"
"XdpConfig" = "kv_xdp_config"
"ClassVal" = "kv_class_val"
"ExeKey" = "kv_exe_key"
"ExeClass" = "kv_exe_class"
"KeyReq" = "kv_key_req"
"Policy" = "kv_policy"
"Identity" = "kv_identity"
"PolicyHeader" = "kv_policy_header"
"Rule" = "kv_rule"
"AddrKey" = "kv_addr_key"
"Event" = "kv_event"
"GatewayCfg" = "kv_gateway_cfg"
"PuntRecord" = "kv_punt_record"
"OrigKey" = "kv_orig_key"
"Verdict" = "kv_verdict"
"StatReason" = "kv_stat"
"EventKind" = "kv_event_kind"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
