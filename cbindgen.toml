# cbindgen config for bpf/include/kavach_abi.h — run `cargo xtask codegen`.
language = "C"
include_guard = "KAVACH_ABI_H"
no_includes = true
sys_includes = []
autogen_warning = "/* GENERATED by `cargo xtask codegen` from crates/kavach-common/src/abi.rs. DO NOT EDIT. */"
style = "tag"
cpp_compat = false
usize_is_size_t = false

[export]
include = ["FlowKey","FlowVal","BlockKey","BlockVal","SrcKey","TokenBucket","XdpConfig","ExeKey","Identity","PolicyHeader","Rule","AddrSetKey","Event","Verdict","StatReason","EventKind"]
exclude = ["LAYOUT"]

[export.rename]
"FlowKey" = "kv_flow_key"
"FlowVal" = "kv_flow_val"
"BlockKey" = "kv_block_key"
"BlockVal" = "kv_block_val"
"SrcKey" = "kv_src_key"
"TokenBucket" = "kv_token_bucket"
"XdpConfig" = "kv_xdp_config"
"ExeKey" = "kv_exe_key"
"Identity" = "kv_identity"
"PolicyHeader" = "kv_policy_header"
"Rule" = "kv_rule"
"AddrSetKey" = "kv_addr_set_key"
"Event" = "kv_event"
"Verdict" = "kv_verdict"
"StatReason" = "kv_stat"
"EventKind" = "kv_event_kind"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
