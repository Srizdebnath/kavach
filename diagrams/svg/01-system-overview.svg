<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title desc">
<title id="title">Kavach: system overview</title>
<desc id="desc">The kernel enforces, user space decides. They meet only at pinned BPF maps, the ring buffer and signed bundles.</desc>
<style>
