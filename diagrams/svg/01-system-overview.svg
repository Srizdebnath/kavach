<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="719" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Kavach: system overview</text>
<text x="24" y="60" class="s m">The kernel enforces, user space decides. They meet only at pinned BPF maps, the ring buffer and signed bundles.</text>
<rect x="24" y="76" width="912" height="96" rx="12" class="band dash" stroke-width="1.2"/>
<text x="38" y="96" class="cap c-p">BUILD TIME · CI / POLICY REPO</text>
<rect x="48" y="108" width="210" height="50" rx="8" class="b-p" stroke-width="1.4"/>
<text x="153" y="128.5" class="h2 c-p" text-anchor="middle">kavach.toml</text>
<text x="153" y="144.95" class="s m" text-anchor="middle">in git, reviewed like code</text>
<rect x="314" y="108" width="290" height="50" rx="8" class="b-p" stroke-width="1.4"/>
<text x="459" y="128.5" class="h2 c-p" text-anchor="middle">kavachctl compile · sign</text>
<text x="459" y="144.95" class="s m" text-anchor="middle">validate, shadow check, Ed25519 (key stays in CI)</text>
<rect x="660" y="108" width="252" height="50" rx="8" class="b-p" stroke-width="1.4"/>
<text x="786" y="128.5" class="h2 c-p" text-anchor="middle">policy.kvb</text>
<text x="786" y="144.95" class="s m" text-anchor="middle">signed KVB1 bundle</text>
<path d="M258,133 L312,133" class="s-p" stroke-width="1.6" marker-end="url(#ah-p)"/>
<path d="M604,133 L658,133" class="s-p" stroke-width="1.6" marker-end="url(#ah-p)"/>
<rect x="24" y="192" width="912" height="210" rx="12" class="band dash" stroke-width="1.2"/>
<text x="38" y="212" class="cap c-u">USER SPACE · RUST</text>
<rect x="48" y="228" width="190" height="64" rx="8" class="b-u" stroke-width="1.4"/>
<text x="143" y="255.5" class="h2 c-u" text-anchor="middle">kavachctl</text>
<text x="143" y="271.95" class="s m" text-anchor="middle">operator CLI, explain, audit</text>
<rect x="48" y="316" width="190" height="66" rx="8" class="b-n dash" stroke-width="1.4"/>
<text x="143" y="336.5" class="h2 c-n" text-anchor="middle">kavach-gateway</text>
<text x="143" y="352.95" class="s m" text-anchor="middle">L7 MCP / A2A proxy</text>
<text x="143" y="368.95" class="s m" text-anchor="middle">v0.4 · decision core only</text>
<rect x="290" y="216" width="622" height="170" rx="8" class="b-u" stroke-width="1.4"/>
<text x="306" y="238" class="h2 c-u">kavachd</text>
<text x="372" y="238" class="xs m">tokio daemon · aya loader · supervised tasks restart without touching the kernel</text>
<rect x="306" y="252" width="140" height="62" rx="8" class="b-n" stroke-width="1.4"/>
<text x="376" y="270.5" class="h2 c-n" text-anchor="middle">control API</text>
<text x="376" y="286.95" class="s t" text-anchor="middle">UDS NDJSON</text>
<text x="376" y="302.95" class="s m" text-anchor="middle">SO_PEERCRED roles</text>
<rect x="455" y="252" width="140" height="62" rx="8" class="b-n" stroke-width="1.4"/>
<text x="525" y="270.5" class="h2 c-n" text-anchor="middle">identity broker</text>
<text x="525" y="286.95" class="s t" text-anchor="middle">SHA-256 of executables</text>
<text x="525" y="302.95" class="s m" text-anchor="middle">trust walk, exe_class</text>
<rect x="604" y="252" width="140" height="62" rx="8" class="b-n" stroke-width="1.4"/>
<text x="674" y="270.5" class="h2 c-n" text-anchor="middle">event reader</text>
<text x="674" y="286.95" class="s t" text-anchor="middle">ring buffer → events</text>
<text x="674" y="302.95" class="s m" text-anchor="middle">+ audit (≤10 drops/s)</text>
<rect x="753" y="252" width="140" height="62" rx="8" class="b-n" stroke-width="1.4"/>
<text x="823" y="270.5" class="h2 c-n" text-anchor="middle">housekeeping</text>
<text x="823" y="286.95" class="s t" text-anchor="middle">FQDN refresh, TTLs</text>
<text x="823" y="302.95" class="s m" text-anchor="middle">blocklist purge (30 s)</text>
<rect x="306" y="326" width="342" height="46" rx="8" class="b-n" stroke-width="1.4"/>
<text x="477" y="344.5" class="h2 c-n" text-anchor="middle">policy state</text>
<text x="477" y="360.95" class="s mono t" text-anchor="middle">verify → diff → stage → flip → drain</text>
<rect x="660" y="326" width="236" height="46" rx="8" class="b-g" stroke-width="1.4"/>
<text x="778" y="344.5" class="h2 c-g" text-anchor="middle">audit.log</text>
<text x="778" y="360.95" class="s m" text-anchor="middle">hash-chained JSONL</text>
<path d="M238,262 L288,262" class="s-u" stroke-width="1.6" marker-end="url(#ah-u)"/>
<rect x="249.92" y="243.5" width="26.16" height="15.5" rx="3" class="bgf"/>
<text x="263" y="254" class="xs m" text-anchor="middle">UDS</text>
<path d="M786,158 L786,182 L143,182 L143,226" class="s-p" stroke-width="1.6" marker-end="url(#ah-p)"/>
<rect x="401.375" y="175.5" width="137.25" height="15.5" rx="3" class="bgf"/>
<text x="470" y="186" class="xs c-p" text-anchor="middle">kavachctl apply policy.kvb</text>
<path d="M238,349 L288,349" class="ln dash" stroke-width="1.6" marker-end="url(#ah-ln)"/>
<rect x="24" y="422" width="912" height="266" rx="12" class="band dash" stroke-width="1.2"/>
<text x="38" y="442" class="cap c-k">KERNEL · C EBPF, VERIFIER-CHECKED, CO-RE</text>
<rect x="48" y="456" width="236" height="72" rx="8" class="b-k" stroke-width="1.4"/>
<text x="166" y="479.5" class="h2 c-k" text-anchor="middle">XDP · xdp_filter.c</text>
<text x="166" y="495.95" class="s t" text-anchor="middle">blocklist (LPM trie)</text>
<text x="166" y="511.95" class="s t" text-anchor="middle">GCRA rate limit per source</text>
<rect x="304" y="456" width="236" height="72" rx="8" class="b-k" stroke-width="1.4"/>
<text x="422" y="479.5" class="h2 c-k" text-anchor="middle">TC · tc_flow.c</text>
<text x="422" y="495.95" class="s t" text-anchor="middle">flow cache, ingress rules</text>
<text x="422" y="511.95" class="s t" text-anchor="middle">re-evaluate on policy flip</text>
<rect x="604" y="456" width="308" height="72" rx="8" class="b-k" stroke-width="1.4"/>
<text x="758" y="479.5" class="h2 c-k" text-anchor="middle">BPF-LSM · lsm_egress.c</text>
<text x="758" y="495.95" class="s t" text-anchor="middle">socket_connect / sendmsg verdicts</text>
<text x="758" y="511.95" class="s t" text-anchor="middle">exec, file_open, truncate: identity + taint</text>
<rect x="48" y="552" width="864" height="62" rx="8" class="b-k" stroke-width="1.4"/>
<text x="480" y="570.5" class="h2 c-k" text-anchor="middle">pinned BPF maps · /sys/fs/bpf/kavach/v2</text>
<text x="480" y="586.95" class="s mono t" text-anchor="middle">policy_slots[2] · policy_gen · exe_class · uid_class · cgroup_class · addr_sets</text>
<text x="480" y="602.95" class="s mono t" text-anchor="middle">blocklist · rate_buckets · flow_cache · sk_ident · stats · key_req · events (ringbuf)</text>
<path d="M166,528 L166,550" class="s-k" stroke-width="1.3" marker-end="url(#ah-k)" marker-start="url(#ah-k)"/>
<path d="M422,528 L422,550" class="s-k" stroke-width="1.3" marker-end="url(#ah-k)" marker-start="url(#ah-k)"/>
<path d="M758,528 L758,550" class="s-k" stroke-width="1.3" marker-end="url(#ah-k)" marker-start="url(#ah-k)"/>
<rect x="560" y="630" width="352" height="44" rx="8" class="b-n dash" stroke-width="1.4"/>
<text x="736" y="647.5" class="h2 c-n" text-anchor="middle">kavach.ko · Rust kavach-core as a kfunc</text>
<text x="736" y="663.95" class="s m" text-anchor="middle">v0.4 planned; eBPF C mirror stays as fallback</text>
<text x="48" y="650" class="s m">packets: NIC → XDP → TC → socket</text>
<text x="48" y="668" class="s m">connections: connect() → LSM → TC → NIC</text>
<path d="M570,386 L570,550" class="s-u" stroke-width="1.6" marker-end="url(#ah-u)"/>
<rect x="416.36" y="401.5" width="149.64" height="15.5" rx="3" class="bgf"/>
<text x="563" y="412" class="xs c-u" text-anchor="end">stage · flip · classes · sets</text>
<path d="M588,550 L588,386" class="s-k" stroke-width="1.6" marker-end="url(#ah-k)"/>
<rect x="592" y="401.5" width="153.21" height="15.5" rx="3" class="bgf"/>
<text x="595" y="412" class="xs c-k">events · stats · key reports</text>
<rect x="24" y="696" width="22" height="13" rx="3" class="b-k" stroke-width="1.4"/>
<text x="52" y="706" class="xs m">kernel (C eBPF)</text>
<rect x="151.7" y="696" width="22" height="13" rx="3" class="b-u" stroke-width="1.4"/>
<text x="179.7" y="706" class="xs m">user space (Rust)</text>
<rect x="289.9" y="696" width="22" height="13" rx="3" class="b-p" stroke-width="1.4"/>
<text x="317.9" y="706" class="xs m">policy / CI</text>
<rect x="395.13" y="696" width="22" height="13" rx="3" class="b-n dash" stroke-width="1.4"/>
