<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" width="960" height="604" role="img" aria-labelledby="title desc">
<title id="title">Upgrades across an ABI change</title>
<desc id="desc">Pins are versioned by map layout, so a new daemon never adopts maps it cannot read, and there is no unenforced window.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.h1{font-size:20px;font-weight:700}
.h2{font-size:13.5px;font-weight:650}
.b{font-size:12.5px}
.s{font-size:11.5px}
.xs{font-size:10.5px}
.bold{font-weight:650}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.dash{stroke-dasharray:5 4}
.bg{fill:#ffffff;stroke:#d0d7de}
.bgf{fill:#ffffff}
.t{fill:#1f2328}
.m{fill:#59636e}
.ln{stroke:#6e7781;fill:none}
.fln{fill:#6e7781}
.band{fill:none;stroke:#d0d7de}
.b-k{fill:#fff1e0;stroke:#c2620a}
.c-k{fill:#8a4600}
.s-k{stroke:#c2620a;fill:none}
.f-k{fill:#c2620a}
.b-u{fill:#e8f1ff;stroke:#2f6fde}
.c-u{fill:#174ea6}
.s-u{stroke:#2f6fde;fill:none}
.f-u{fill:#2f6fde}
.b-p{fill:#f2ebff;stroke:#7c4ddb}
.c-p{fill:#5a32a3}
.s-p{stroke:#7c4ddb;fill:none}
.f-p{fill:#7c4ddb}
.b-g{fill:#e6f6ec;stroke:#1f8f4e}
.c-g{fill:#116329}
.s-g{stroke:#1f8f4e;fill:none}
.f-g{fill:#1f8f4e}
.b-r{fill:#ffebee;stroke:#cf222e}
.c-r{fill:#a40e26}
.s-r{stroke:#cf222e;fill:none}
.f-r{fill:#cf222e}
.b-n{fill:#f6f8fa;stroke:#8c959f}
.c-n{fill:#424a53}
.s-n{stroke:#8c959f;fill:none}
.f-n{fill:#8c959f}
.b-y{fill:#fff8c5;stroke:#9a6700}
.c-y{fill:#7d4e00}
.s-y{stroke:#9a6700;fill:none}
.f-y{fill:#9a6700}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.bgf{fill:#0d1117}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.ln{stroke:#8b949e;fill:none}
.fln{fill:#8b949e}
.band{fill:none;stroke:#30363d}
.b-k{fill:#2a1a08;stroke:#f0883e}
.c-k{fill:#ffa657}
.s-k{stroke:#f0883e;fill:none}
.f-k{fill:#f0883e}
.b-u{fill:#0c1d36;stroke:#4493f8}
.c-u{fill:#79c0ff}
.s-u{stroke:#4493f8;fill:none}
.f-u{fill:#4493f8}
.b-p{fill:#1e1533;stroke:#a371f7}
.c-p{fill:#d2a8ff}
.s-p{stroke:#a371f7;fill:none}
.f-p{fill:#a371f7}
.b-g{fill:#0b2616;stroke:#3fb950}
.c-g{fill:#7ee787}
.s-g{stroke:#3fb950;fill:none}
.f-g{fill:#3fb950}
.b-r{fill:#2c1013;stroke:#f85149}
.c-r{fill:#ff7b72}
.s-r{stroke:#f85149;fill:none}
.f-r{fill:#f85149}
.b-n{fill:#161b22;stroke:#6e7681}
.c-n{fill:#c9d1d9}
.s-n{stroke:#6e7681;fill:none}
.f-n{fill:#6e7681}
.b-y{fill:#2b2208;stroke:#d29922}
.c-y{fill:#e3b341}
.s-y{stroke:#d29922;fill:none}
.f-y{fill:#d29922}
}
</style>
<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="603" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Upgrades across an ABI change</text>
<text x="24" y="60" class="s m">Pins are versioned by map layout, so a new daemon never adopts maps it cannot read, and there is no unenforced window.</text>
<rect x="24" y="84" width="300" height="196" rx="8" class="b-k" stroke-width="1.4"/>
<text x="40" y="108" class="h2 c-k">bpffs during the upgrade</text>
<text x="40" y="136" class="xs mono t">/sys/fs/bpf/kavach/</text>
<text x="40" y="156" class="xs mono t" xml:space="preserve" style="white-space:pre">├── v1/   previous kavachd</text>
<text x="40" y="176" class="xs mono t" xml:space="preserve" style="white-space:pre">│   ├── links: xdp, tcx, lsm</text>
<text x="40" y="196" class="xs mono t" xml:space="preserve" style="white-space:pre">│   └── maps (old layout)</text>
<text x="40" y="216" class="xs mono t" xml:space="preserve" style="white-space:pre">└── v2/   this kavachd</text>
<text x="40" y="236" class="xs mono t" xml:space="preserve" style="white-space:pre">    ├── links: xdp, tcx, lsm</text>
<text x="40" y="256" class="xs mono t" xml:space="preserve" style="white-space:pre">    └── maps (ABI_VERSION = 2)</text>
<rect x="24" y="296" width="300" height="110" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="322.5" class="h2 c-p">ABI guard (unit test)</text>
<text x="36" y="338.95" class="s m">FNV-1a over (name, size) of every</text>
<text x="36" y="354.95" class="s m">kavach-common ABI type must equal</text>
<text x="36" y="370.95" class="s m">ABI_LAYOUT_FINGERPRINT: a layout</text>
<text x="36" y="386.95" class="s m">change without a version bump fails</text>
<rect x="24" y="422" width="300" height="136" rx="8" class="b-n" stroke-width="1.4"/>
<text x="36" y="453.5" class="h2 c-n">same ABI version</text>
<text x="36" y="469.95" class="s m">re-adopt pins in place; the generation</text>
<text x="36" y="485.95" class="s m">counter continues; XDP is replaced</text>
<text x="36" y="501.95" class="s m">through its pinned link; TC attaches</text>
<text x="36" y="517.95" class="s m">the new program before detaching</text>
<text x="36" y="533.95" class="s m">the old one</text>
<rect x="356" y="84" width="580" height="70" rx="8" class="b-n" stroke-width="1.4"/>
<text x="368" y="114.5" class="h2 c-n" xml:space="preserve" style="white-space:pre">1  package upgrade (.deb · .rpm · tarball)</text>
<text x="368" y="130.95" class="s m">the old programs keep enforcing from v1/ during the install</text>
<rect x="844" y="94" width="80" height="22" rx="11" class="b-n" stroke-width="1.4"/>
<text x="884" y="108.8" class="xs bold c-n" text-anchor="middle">v1</text>
<rect x="356" y="166" width="580" height="70" rx="8" class="b-u" stroke-width="1.4"/>
<text x="368" y="196.5" class="h2 c-u" xml:space="preserve" style="white-space:pre">2  new kavachd loads and pins under v2/</text>
<text x="368" y="212.95" class="s m">attaches TC (new before old) and LSM; never re-adopts v1 maps</text>
<rect x="844" y="176" width="80" height="22" rx="11" class="b-y" stroke-width="1.4"/>
<text x="884" y="190.8" class="xs bold c-y" text-anchor="middle">v1 + v2</text>
<path d="M380,153 L380,165" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="356" y="248" width="580" height="70" rx="8" class="b-u" stroke-width="1.4"/>
<text x="368" y="278.5" class="h2 c-u" xml:space="preserve" style="white-space:pre">3  XDP attach may fail</text>
<text x="368" y="294.95" class="s m">the v1 XDP link still holds the interface: remembered for retry</text>
<rect x="844" y="258" width="80" height="22" rx="11" class="b-y" stroke-width="1.4"/>
<text x="884" y="272.8" class="xs bold c-y" text-anchor="middle">v1 + v2</text>
<path d="M380,235 L380,247" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="356" y="330" width="580" height="70" rx="8" class="b-u" stroke-width="1.4"/>
<text x="368" y="360.5" class="h2 c-u" xml:space="preserve" style="white-space:pre">4  restore the policy</text>
<text x="368" y="376.95" class="s m">verify active.kvb and stage it into the v2 maps</text>
<rect x="844" y="340" width="80" height="22" rx="11" class="b-y" stroke-width="1.4"/>
<text x="884" y="354.8" class="xs bold c-y" text-anchor="middle">v1 + v2</text>
<path d="M380,317 L380,329" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="356" y="412" width="580" height="70" rx="8" class="b-u" stroke-width="1.4"/>
<text x="368" y="442.5" class="h2 c-u" xml:space="preserve" style="white-space:pre">5  retire_stale_abis()</text>
<text x="368" y="458.95" class="s m">remove_dir_all(v1/): the unpinned links detach</text>
<rect x="844" y="422" width="80" height="22" rx="11" class="b-g" stroke-width="1.4"/>
<text x="884" y="436.8" class="xs bold c-g" text-anchor="middle">v2</text>
<path d="M380,399 L380,411" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="356" y="494" width="580" height="70" rx="8" class="b-u" stroke-width="1.4"/>
<text x="368" y="524.5" class="h2 c-u" xml:space="preserve" style="white-space:pre">6  retry XDP every 50 ms, up to ~2 s</text>
<text x="368" y="540.95" class="s m">bpffs frees the unlinked pin after an RCU grace period</text>
<rect x="844" y="504" width="80" height="22" rx="11" class="b-g" stroke-width="1.4"/>
<text x="884" y="518.8" class="xs bold c-g" text-anchor="middle">v2</text>
<path d="M380,481 L380,493" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<text x="356" y="588" class="xs m">pill = which programs are enforcing at that step</text>
</svg>
