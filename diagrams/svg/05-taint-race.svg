<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
<title id="title">Tamper revocation: the placeholder protocol</title>
<desc id="desc">How a write that races the hash can never leave a stale trusted class behind (FR-ID-3).</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.h1{font-size:20px;font-weight:700}
.h2{font-size:13.5px;font-weight:650}
.b{font-size:12.5px}
.s{font-size:11.5px}
.xs{font-size:10.5px}
.bold{font-weight:650}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.dash{stroke-dasharray:5 4}
.bg{fill:#ffffff;stroke:#d0d7de}
.bgf{fill:#ffffff}
.t{fill:#1f2328}
.m{fill:#59636e}
.ln{stroke:#6e7781;fill:none}
.fln{fill:#6e7781}
.band{fill:none;stroke:#d0d7de}
.b-k{fill:#fff1e0;stroke:#c2620a}
.c-k{fill:#8a4600}
.s-k{stroke:#c2620a;fill:none}
.f-k{fill:#c2620a}
.b-u{fill:#e8f1ff;stroke:#2f6fde}
.c-u{fill:#174ea6}
.s-u{stroke:#2f6fde;fill:none}
.f-u{fill:#2f6fde}
.b-p{fill:#f2ebff;stroke:#7c4ddb}
.c-p{fill:#5a32a3}
.s-p{stroke:#7c4ddb;fill:none}
.f-p{fill:#7c4ddb}
.b-g{fill:#e6f6ec;stroke:#1f8f4e}
.c-g{fill:#116329}
.s-g{stroke:#1f8f4e;fill:none}
.f-g{fill:#1f8f4e}
.b-r{fill:#ffebee;stroke:#cf222e}
.c-r{fill:#a40e26}
.s-r{stroke:#cf222e;fill:none}
.f-r{fill:#cf222e}
.b-n{fill:#f6f8fa;stroke:#8c959f}
.c-n{fill:#424a53}
.s-n{stroke:#8c959f;fill:none}
.f-n{fill:#8c959f}
.b-y{fill:#fff8c5;stroke:#9a6700}
.c-y{fill:#7d4e00}
.s-y{stroke:#9a6700;fill:none}
.f-y{fill:#9a6700}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.bgf{fill:#0d1117}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.ln{stroke:#8b949e;fill:none}
.fln{fill:#8b949e}
.band{fill:none;stroke:#30363d}
.b-k{fill:#2a1a08;stroke:#f0883e}
.c-k{fill:#ffa657}
.s-k{stroke:#f0883e;fill:none}
.f-k{fill:#f0883e}
.b-u{fill:#0c1d36;stroke:#4493f8}
.c-u{fill:#79c0ff}
.s-u{stroke:#4493f8;fill:none}
.f-u{fill:#4493f8}
.b-p{fill:#1e1533;stroke:#a371f7}
.c-p{fill:#d2a8ff}
.s-p{stroke:#a371f7;fill:none}
.f-p{fill:#a371f7}
.b-g{fill:#0b2616;stroke:#3fb950}
.c-g{fill:#7ee787}
.s-g{stroke:#3fb950;fill:none}
.f-g{fill:#3fb950}
.b-r{fill:#2c1013;stroke:#f85149}
.c-r{fill:#ff7b72}
.s-r{stroke:#f85149;fill:none}
.f-r{fill:#f85149}
.b-n{fill:#161b22;stroke:#6e7681}
.c-n{fill:#c9d1d9}
.s-n{stroke:#6e7681;fill:none}
.f-n{fill:#6e7681}
.b-y{fill:#2b2208;stroke:#d29922}
.c-y{fill:#e3b341}
.s-y{stroke:#d29922;fill:none}
.f-y{fill:#d29922}
}
</style>
<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="599" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Tamper revocation: the placeholder protocol</text>
<text x="24" y="60" class="s m">How a write that races the hash can never leave a stale trusted class behind (FR-ID-3).</text>
<rect x="30" y="76" width="160" height="34" rx="8" class="b-u" stroke-width="1.4"/>
<text x="110" y="96.5" class="h2 c-u" text-anchor="middle">kavachd</text>
<path d="M110,110 L110,500" class="ln dash" stroke-width="1"/>
<rect x="220" y="76" width="160" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="300" y="96.5" class="h2 c-k" text-anchor="middle">key_req (1 slot)</text>
<path d="M300,110 L300,500" class="ln dash" stroke-width="1"/>
<rect x="410" y="76" width="160" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="490" y="96.5" class="h2 c-k" text-anchor="middle">LSM file_open</text>
<path d="M490,110 L490,500" class="ln dash" stroke-width="1"/>
<rect x="600" y="76" width="160" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="680" y="96.5" class="h2 c-k" text-anchor="middle">exe_class</text>
<path d="M680,110 L680,500" class="ln dash" stroke-width="1"/>
<rect x="790" y="76" width="160" height="34" rx="8" class="b-r" stroke-width="1.4"/>
<text x="870" y="96.5" class="h2 c-r" text-anchor="middle">writer (attacker)</text>
<path d="M870,110 L870,500" class="ln dash" stroke-width="1"/>
<path d="M110,138 L297,138" class="s-u" stroke-width="1.6" marker-end="url(#ah-u)"/>
<rect x="156.85" y="122.5" width="96.3" height="15.5" rx="3" class="bgf"/>
<text x="205" y="133" class="xs c-u" text-anchor="middle">① arm {nonce, tid}</text>
<path d="M110,178 L487,178" class="s-u" stroke-width="1.6" marker-end="url(#ah-u)"/>
<rect x="239.04" y="162.5" width="121.92" height="15.5" rx="3" class="bgf"/>
<text x="300" y="173" class="xs c-u" text-anchor="middle">② open(exe, O_RDONLY)</text>
<path d="M490,218 L677,218" class="s-k" stroke-width="1.6" marker-end="url(#ah-k)"/>
<rect x="475.215" y="202.5" width="219.57" height="15.5" rx="3" class="bgf"/>
<text x="585" y="213" class="xs c-k" text-anchor="middle">③ insert placeholder, mask 0 (bucket lock)</text>
<path d="M490,250 L516,250 L516,262 L492,262" class="s-k" stroke-width="1.4" marker-end="url(#ah-k)"/>
<rect x="524" y="247.5" width="134.94" height="15.5" rx="3" class="bgf"/>
<text x="527" y="258" class="xs c-k">④ then read i_writecount</text>
<path d="M490,298 L113,298" class="s-k" stroke-width="1.6" marker-end="url(#ah-k)"/>
<rect x="150.63" y="282.5" width="298.74" height="15.5" rx="3" class="bgf"/>
<text x="300" y="293" class="xs c-k" text-anchor="middle">⑤ report {ExeKey, writers} via ring buffer; clear key_req</text>
<path d="M110,330 L136,330 L136,342 L112,342" class="s-u" stroke-width="1.4" marker-end="url(#ah-u)"/>
<rect x="144" y="327.5" width="254.22" height="15.5" rx="3" class="bgf"/>
<text x="147" y="338" class="xs c-u">⑥ writers &gt; 0 → refuse; else SHA-256 of that fd</text>
<path d="M870,378 L493,378" class="s-r" stroke-width="1.6" marker-end="url(#ah-r)"/>
<rect x="603.185" y="362.5" width="153.63" height="15.5" rx="3" class="bgf"/>
<text x="680" y="373" class="xs c-r" text-anchor="middle">Ⓐ race: open(exe, O_WRONLY)</text>
<path d="M490,418 L677,418" class="s-r" stroke-width="1.6" marker-end="url(#ah-r)"/>
<rect x="459.36" y="402.5" width="251.28" height="15.5" rx="3" class="bgf"/>
<text x="585" y="413" class="xs c-r" text-anchor="middle">Ⓑ delete exe_class[key] (fail → refuse the write)</text>
<path d="M110,458 L677,458" class="s-u" stroke-width="1.6" marker-end="url(#ah-u)"/>
<rect x="308.63" y="442.5" width="172.74" height="15.5" rx="3" class="bgf"/>
<text x="395" y="453" class="xs c-u" text-anchor="middle">⑦ update(key, mask, BPF_EXIST)</text>
<rect x="24" y="512" width="448" height="72" rx="8" class="b-g" stroke-width="1.4"/>
<text x="248" y="535.5" class="h2 c-g" text-anchor="middle">no race: placeholder still present</text>
<text x="248" y="551.95" class="s m" text-anchor="middle">commit succeeds → entry COMMITTED with mask + nonce;</text>
<text x="248" y="567.95" class="s m" text-anchor="middle">the binary is trusted until its next write-open</text>
<rect x="488" y="512" width="448" height="72" rx="8" class="b-r" stroke-width="1.4"/>
<text x="712" y="535.5" class="h2 c-r" text-anchor="middle">race Ⓐ happened: placeholder deleted</text>
<text x="712" y="551.95" class="s m" text-anchor="middle">BPF_EXIST fails (ENOENT) → nothing is committed;</text>
<text x="712" y="567.95" class="s m" text-anchor="middle">the binary stays untrusted. No side table can overflow.</text>
</svg>
