<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">G5 · IP addresses are not identity</title>
<desc id="desc">Known gap of modern firewalls (SRS §1.2): workloads change IPs every minute</desc>
<style>
