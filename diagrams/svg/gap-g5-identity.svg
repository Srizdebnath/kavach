<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">G5 · IP addresses are not identity</text>
<text x="24" y="60" class="s m">Known gap of modern firewalls (SRS §1.2): workloads change IPs every minute</text>
<rect x="24" y="84" width="296" height="286" rx="8" class="b-r" stroke-width="1.4"/>
<text x="40" y="112" class="h2 c-r">Typical firewall</text>
<circle cx="46" cy="138" r="8" class="b-r" stroke-width="1.4"/>
<path d="M42.5,134.5 L49.5,141.5 M49.5,134.5 L42.5,141.5" class="s-r" stroke-width="1.6"/>
<text x="62" y="142" class="s t">rules allow 10.0.3.7, not</text>
<text x="62" y="158" class="s t">"the payroll service"</text>
<circle cx="46" cy="184" r="8" class="b-r" stroke-width="1.4"/>
<path d="M42.5,180.5 L49.5,187.5 M49.5,180.5 L42.5,187.5" class="s-r" stroke-width="1.6"/>
<text x="62" y="188" class="s t">every process on an allowed</text>
<text x="62" y="204" class="s t">host inherits access</text>
<circle cx="46" cy="230" r="8" class="b-r" stroke-width="1.4"/>
<path d="M42.5,226.5 L49.5,233.5 M49.5,226.5 L42.5,233.5" class="s-r" stroke-width="1.6"/>
<text x="62" y="234" class="s t">IPs churn with autoscaling</text>
<text x="62" y="250" class="s t">and containers</text>
<path d="M326,227 L354,227" class="ln" stroke-width="2" marker-end="url(#ah-ln)"/>
<rect x="360" y="84" width="576" height="286" rx="8" class="b-g" stroke-width="1.4"/>
<text x="376" y="112" class="h2 c-g">How Kavach handles it</text>
<text x="920" y="112" class="xs m" text-anchor="end">built: in the data path · lib: built, not wired in · v0.4: planned</text>
<rect x="376" y="134" width="64" height="20" rx="10" class="b-g" stroke-width="1.4"/>
<text x="408" y="147.8" class="xs bold c-g" text-anchor="middle">built</text>
<text x="452" y="148" class="s bold t">Rules name the workload: who = { exe | binary | user | cgroup }</text>
<text x="452" y="165" class="xs m">AND across dimensions, OR within a list; ≤ 64 selectors</text>
<rect x="376" y="180" width="64" height="20" rx="10" class="b-g" stroke-width="1.4"/>
<text x="408" y="193.8" class="xs bold c-g" text-anchor="middle">built</text>
<text x="452" y="194" class="s bold t">binary = SHA-256 of the executable's content</text>
<text x="452" y="211" class="xs m">keyed in-kernel by the live inode {ptr, i_ino, s_dev, i_generation}</text>
<rect x="376" y="226" width="64" height="20" rx="10" class="b-g" stroke-width="1.4"/>
<text x="408" y="239.8" class="xs bold c-g" text-anchor="middle">built</text>
<text x="452" y="240" class="s bold t">Tampering revokes trust in the kernel</text>
<text x="452" y="257" class="xs m">write-open or truncate deletes the exe_class entry</text>
<rect x="376" y="272" width="64" height="20" rx="10" class="b-g" stroke-width="1.4"/>
<text x="408" y="285.8" class="xs bold c-g" text-anchor="middle">built</text>
<text x="452" y="286" class="s bold t">cgroup subtree match for services and containers</text>
<text x="452" y="303" class="xs m">task's cgroup + up to 8 ancestors; overlay files keyed by the real file</text>
<rect x="376" y="318" width="64" height="20" rx="10" class="b-n dash" stroke-width="1.4"/>
<text x="408" y="331.8" class="xs bold c-n" text-anchor="middle">v0.4</text>
<text x="452" y="332" class="s bold t">Kubernetes labels and SPIFFE IDs</text>
<text x="452" y="349" class="xs m">the compiler rejects k8s / spiffe selectors until the v0.4 node agent</text>
<rect x="24" y="388" width="912" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="40" y="411" class="xs t">An attacker who lands on an allowed host still cannot use its network access from an unapproved or modified binary.</text>
</svg>
