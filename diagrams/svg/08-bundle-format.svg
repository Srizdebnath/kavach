<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Bundle format: KVB1</title>
<desc id="desc">What kavachctl sign writes and kavachd verifies. Fixed 76-byte header, postcard payload, Ed25519 signature.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.h1{font-size:20px;font-weight:700}
.h2{font-size:13.5px;font-weight:650}
.b{font-size:12.5px}
.s{font-size:11.5px}
.xs{font-size:10.5px}
.bold{font-weight:650}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.dash{stroke-dasharray:5 4}
.bg{fill:#ffffff;stroke:#d0d7de}
.bgf{fill:#ffffff}
.t{fill:#1f2328}
.m{fill:#59636e}
.ln{stroke:#6e7781;fill:none}
.fln{fill:#6e7781}
.band{fill:none;stroke:#d0d7de}
.b-k{fill:#fff1e0;stroke:#c2620a}
.c-k{fill:#8a4600}
.s-k{stroke:#c2620a;fill:none}
.f-k{fill:#c2620a}
.b-u{fill:#e8f1ff;stroke:#2f6fde}
.c-u{fill:#174ea6}
.s-u{stroke:#2f6fde;fill:none}
.f-u{fill:#2f6fde}
.b-p{fill:#f2ebff;stroke:#7c4ddb}
.c-p{fill:#5a32a3}
.s-p{stroke:#7c4ddb;fill:none}
.f-p{fill:#7c4ddb}
.b-g{fill:#e6f6ec;stroke:#1f8f4e}
.c-g{fill:#116329}
.s-g{stroke:#1f8f4e;fill:none}
.f-g{fill:#1f8f4e}
.b-r{fill:#ffebee;stroke:#cf222e}
.c-r{fill:#a40e26}
.s-r{stroke:#cf222e;fill:none}
.f-r{fill:#cf222e}
.b-n{fill:#f6f8fa;stroke:#8c959f}
.c-n{fill:#424a53}
.s-n{stroke:#8c959f;fill:none}
.f-n{fill:#8c959f}
.b-y{fill:#fff8c5;stroke:#9a6700}
.c-y{fill:#7d4e00}
.s-y{stroke:#9a6700;fill:none}
.f-y{fill:#9a6700}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.bgf{fill:#0d1117}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.ln{stroke:#8b949e;fill:none}
.fln{fill:#8b949e}
.band{fill:none;stroke:#30363d}
.b-k{fill:#2a1a08;stroke:#f0883e}
.c-k{fill:#ffa657}
.s-k{stroke:#f0883e;fill:none}
.f-k{fill:#f0883e}
.b-u{fill:#0c1d36;stroke:#4493f8}
.c-u{fill:#79c0ff}
.s-u{stroke:#4493f8;fill:none}
.f-u{fill:#4493f8}
.b-p{fill:#1e1533;stroke:#a371f7}
.c-p{fill:#d2a8ff}
.s-p{stroke:#a371f7;fill:none}
.f-p{fill:#a371f7}
.b-g{fill:#0b2616;stroke:#3fb950}
.c-g{fill:#7ee787}
.s-g{stroke:#3fb950;fill:none}
.f-g{fill:#3fb950}
.b-r{fill:#2c1013;stroke:#f85149}
.c-r{fill:#ff7b72}
.s-r{stroke:#f85149;fill:none}
.f-r{fill:#f85149}
.b-n{fill:#161b22;stroke:#6e7681}
.c-n{fill:#c9d1d9}
.s-n{stroke:#6e7681;fill:none}
.f-n{fill:#6e7681}
.b-y{fill:#2b2208;stroke:#d29922}
.c-y{fill:#e3b341}
.s-y{stroke:#d29922;fill:none}
.f-y{fill:#d29922}
}
</style>
<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="479" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Bundle format: KVB1</text>
<text x="24" y="60" class="s m">What kavachctl sign writes and kavachd verifies. Fixed 76-byte header, postcard payload, Ed25519 signature.</text>
<rect x="24" y="112" width="64" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="56" y="135.5" class="xs bold c-k" text-anchor="middle">magic</text>
<text x="56" y="150.5" class="xs mono t" text-anchor="middle">"KVB1"</text>
<rect x="88" y="112" width="62" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="119" y="135.5" class="xs bold c-k" text-anchor="middle">format</text>
<text x="119" y="150.5" class="xs mono t" text-anchor="middle">u16 = 2</text>
<rect x="150" y="112" width="50" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="175" y="135.5" class="xs bold c-k" text-anchor="middle">flags</text>
<text x="175" y="150.5" class="xs mono t" text-anchor="middle">u16</text>
<rect x="200" y="112" width="74" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="237" y="135.5" class="xs bold c-k" text-anchor="middle">serial</text>
<text x="237" y="150.5" class="xs mono t" text-anchor="middle">u64</text>
<rect x="274" y="112" width="74" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="311" y="135.5" class="xs bold c-k" text-anchor="middle">created</text>
<text x="311" y="150.5" class="xs mono t" text-anchor="middle">u64</text>
<rect x="348" y="112" width="80" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="388" y="135.5" class="xs bold c-k" text-anchor="middle">not_after</text>
<text x="388" y="150.5" class="xs mono t" text-anchor="middle">u64</text>
<rect x="428" y="112" width="76" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="466" y="135.5" class="xs bold c-k" text-anchor="middle">key_id</text>
<text x="466" y="150.5" class="xs mono t" text-anchor="middle">[u8; 8]</text>
<rect x="504" y="112" width="92" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="550" y="135.5" class="xs bold c-k" text-anchor="middle">fleet</text>
<text x="550" y="150.5" class="xs mono t" text-anchor="middle">[u8; 32]</text>
<rect x="596" y="112" width="84" height="56" rx="0" class="b-k" stroke-width="1.4"/>
<text x="638" y="135.5" class="xs bold c-k" text-anchor="middle">payload_len</text>
<text x="638" y="150.5" class="xs mono t" text-anchor="middle">u32</text>
<rect x="680" y="112" width="176" height="56" rx="0" class="b-u" stroke-width="1.4"/>
<text x="768" y="135.5" class="xs bold c-u" text-anchor="middle">payload</text>
<text x="768" y="150.5" class="xs mono t" text-anchor="middle">postcard CompiledPolicy</text>
<rect x="856" y="112" width="80" height="56" rx="0" class="b-g" stroke-width="1.4"/>
<text x="896" y="135.5" class="xs bold c-g" text-anchor="middle">signature</text>
<text x="896" y="150.5" class="xs mono t" text-anchor="middle">[u8; 64]</text>
<text x="26" y="184" class="xs mono m">0</text>
<text x="90" y="184" class="xs mono m">4</text>
<text x="152" y="184" class="xs mono m">6</text>
<text x="202" y="184" class="xs mono m">8</text>
<text x="276" y="184" class="xs mono m">16</text>
<text x="350" y="184" class="xs mono m">24</text>
<text x="430" y="184" class="xs mono m">32</text>
<text x="506" y="184" class="xs mono m">40</text>
<text x="598" y="184" class="xs mono m">72</text>
<text x="682" y="184" class="xs mono m">76</text>
<text x="858" y="184" class="xs mono m">76+len</text>
<path d="M26,104 L26,96 L678,96 L678,104" class="s-k" stroke-width="1.3"/>
<rect x="281.17" y="81.5" width="141.66" height="15.5" rx="3" class="bgf"/>
<text x="352" y="92" class="xs bold c-k" text-anchor="middle">header · 76 bytes · signed</text>
<path d="M682,104 L682,96 L854,96 L854,104" class="s-u" stroke-width="1.3"/>
<rect x="703.47" y="81.5" width="129.06" height="15.5" rx="3" class="bgf"/>
<text x="768" y="92" class="xs bold c-u" text-anchor="middle">payload ≤ 4 MiB · signed</text>
<path d="M858,104 L858,96 L934,96 L934,104" class="s-g" stroke-width="1.3"/>
<rect x="868.64" y="81.5" width="54.72" height="15.5" rx="3" class="bgf"/>
<text x="896" y="92" class="xs bold c-g" text-anchor="middle">signature</text>
<rect x="24" y="210" width="560" height="76" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="236" class="xs mono t">signature = Ed25519(sk, "kavach-bundle-v1\0" ‖ header ‖ payload)</text>
<text x="36" y="251" class="xs mono t" xml:space="preserve" style="white-space:pre">key_id    = SHA-256(public key)[..8]</text>
<text x="36" y="266" class="xs m">pure Ed25519, domain-separated; hosts hold only public keys</text>
<rect x="600" y="210" width="336" height="76" rx="8" class="b-n" stroke-width="1.4"/>
<text x="612" y="236" class="xs bold c-n">policy is data, never code (C3)</text>
<text x="612" y="251" class="xs m">payload decodes to tables only;</text>
<text x="612" y="266" class="xs m">format 1 bundles are still accepted</text>
<text x="24" y="318" class="cap m">KAVACHD VERIFICATION ORDER · bundle::verify</text>
<rect x="24" y="330" width="160" height="34" rx="8" class="b-n" stroke-width="1.4"/>
<text x="104" y="350.2" class="s t" text-anchor="middle">size caps</text>
<path d="M186,347 L208,347" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="210" y="330" width="160" height="34" rx="8" class="b-n" stroke-width="1.4"/>
<text x="290" y="350.2" class="s t" text-anchor="middle">magic + format</text>
<path d="M372,347 L394,347" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="396" y="330" width="160" height="34" rx="8" class="b-n" stroke-width="1.4"/>
<text x="476" y="350.2" class="s t" text-anchor="middle">trusted key_id</text>
<path d="M558,347 L580,347" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="582" y="330" width="160" height="34" rx="8" class="b-n" stroke-width="1.4"/>
<text x="662" y="350.2" class="s t" text-anchor="middle">key not revoked</text>
<path d="M744,347 L766,347" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="768" y="330" width="160" height="34" rx="8" class="b-p" stroke-width="1.4"/>
<text x="848" y="350.2" class="s t" text-anchor="middle">Ed25519 signature</text>
<rect x="24" y="380" width="160" height="34" rx="8" class="b-n" stroke-width="1.4"/>
<text x="104" y="400.2" class="s t" text-anchor="middle">fleet matches</text>
<path d="M186,397 L208,397" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="210" y="380" width="160" height="34" rx="8" class="b-n" stroke-width="1.4"/>
<text x="290" y="400.2" class="s t" text-anchor="middle">serial &gt; active</text>
<path d="M372,397 L394,397" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="396" y="380" width="160" height="34" rx="8" class="b-n" stroke-width="1.4"/>
<text x="476" y="400.2" class="s t" text-anchor="middle">not expired</text>
<path d="M558,397 L580,397" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="582" y="380" width="160" height="34" rx="8" class="b-g" stroke-width="1.4"/>
<text x="662" y="400.2" class="s t" text-anchor="middle">decode payload</text>
<path d="M908,364 L908,372 L104,372 L104,378" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="770" y="380" width="166" height="34" rx="8" class="b-g" stroke-width="1.4"/>
<text x="853" y="400.2" class="s t" text-anchor="middle">→ diff, stage, flip</text>
<path d="M734,397 L768,397" class="s-g" stroke-width="1.3" marker-end="url(#ah-g)"/>
<text x="24" y="448" class="xs m">Nothing attacker-controlled is decoded before the signature check. Any failure → rejected, active policy unchanged,</text>
<text x="24" y="464" class="xs m">audit record + error. Signing keys live in CI; hosts trust /etc/kavach/trusted_keys/*.pub minus revoked_keys.</text>
</svg>
