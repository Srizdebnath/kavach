<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="title desc">
<title id="title">Egress: connect() → BPF-LSM → TC → NIC</title>
<desc id="desc">The verdict happens in the syscall, before a packet exists, with the calling process's identity.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.h1{font-size:20px;font-weight:700}
.h2{font-size:13.5px;font-weight:650}
.b{font-size:12.5px}
.s{font-size:11.5px}
.xs{font-size:10.5px}
.bold{font-weight:650}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.dash{stroke-dasharray:5 4}
.bg{fill:#ffffff;stroke:#d0d7de}
.bgf{fill:#ffffff}
.t{fill:#1f2328}
.m{fill:#59636e}
.ln{stroke:#6e7781;fill:none}
.fln{fill:#6e7781}
.band{fill:none;stroke:#d0d7de}
.b-k{fill:#fff1e0;stroke:#c2620a}
.c-k{fill:#8a4600}
.s-k{stroke:#c2620a;fill:none}
.f-k{fill:#c2620a}
.b-u{fill:#e8f1ff;stroke:#2f6fde}
.c-u{fill:#174ea6}
.s-u{stroke:#2f6fde;fill:none}
.f-u{fill:#2f6fde}
.b-p{fill:#f2ebff;stroke:#7c4ddb}
.c-p{fill:#5a32a3}
.s-p{stroke:#7c4ddb;fill:none}
.f-p{fill:#7c4ddb}
.b-g{fill:#e6f6ec;stroke:#1f8f4e}
.c-g{fill:#116329}
.s-g{stroke:#1f8f4e;fill:none}
.f-g{fill:#1f8f4e}
.b-r{fill:#ffebee;stroke:#cf222e}
.c-r{fill:#a40e26}
.s-r{stroke:#cf222e;fill:none}
.f-r{fill:#cf222e}
.b-n{fill:#f6f8fa;stroke:#8c959f}
.c-n{fill:#424a53}
.s-n{stroke:#8c959f;fill:none}
.f-n{fill:#8c959f}
.b-y{fill:#fff8c5;stroke:#9a6700}
.c-y{fill:#7d4e00}
.s-y{stroke:#9a6700;fill:none}
.f-y{fill:#9a6700}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.bgf{fill:#0d1117}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.ln{stroke:#8b949e;fill:none}
.fln{fill:#8b949e}
.band{fill:none;stroke:#30363d}
.b-k{fill:#2a1a08;stroke:#f0883e}
.c-k{fill:#ffa657}
.s-k{stroke:#f0883e;fill:none}
.f-k{fill:#f0883e}
.b-u{fill:#0c1d36;stroke:#4493f8}
.c-u{fill:#79c0ff}
.s-u{stroke:#4493f8;fill:none}
.f-u{fill:#4493f8}
.b-p{fill:#1e1533;stroke:#a371f7}
.c-p{fill:#d2a8ff}
.s-p{stroke:#a371f7;fill:none}
.f-p{fill:#a371f7}
.b-g{fill:#0b2616;stroke:#3fb950}
.c-g{fill:#7ee787}
.s-g{stroke:#3fb950;fill:none}
.f-g{fill:#3fb950}
.b-r{fill:#2c1013;stroke:#f85149}
.c-r{fill:#ff7b72}
.s-r{stroke:#f85149;fill:none}
.f-r{fill:#f85149}
.b-n{fill:#161b22;stroke:#6e7681}
.c-n{fill:#c9d1d9}
.s-n{stroke:#6e7681;fill:none}
.f-n{fill:#6e7681}
.b-y{fill:#2b2208;stroke:#d29922}
.c-y{fill:#e3b341}
.s-y{stroke:#d29922;fill:none}
.f-y{fill:#d29922}
}
</style>
<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="789" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Egress: connect() → BPF-LSM → TC → NIC</text>
<text x="24" y="60" class="s m">The verdict happens in the syscall, before a packet exists, with the calling process's identity.</text>
<rect x="40" y="80" width="440" height="46" rx="8" class="b-u" stroke-width="1.4"/>
<text x="52" y="98.2" class="s t">connect() (TCP, connected UDP) or</text>
<text x="52" y="114.2" class="s t">sendmsg() with a destination (unconnected UDP)</text>
<rect x="24" y="140" width="912" height="410" rx="12" class="band dash" stroke-width="1.2"/>
<text x="922" y="160" class="cap c-k" text-anchor="end">BPF-LSM · SOCKET_CONNECT / SOCKET_SENDMSG</text>
<rect x="40" y="172" width="440" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="192.2" class="s t">no policy loaded, or not TCP / UDP / ICMP</text>
<path d="M480,189 L518,189" class="s-g" stroke-width="1.6" marker-end="url(#ah-g)"/>
<rect x="520" y="176" width="416" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="532" y="192" class="xs t">allow</text>
<rect x="40" y="222" width="440" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="242.2" class="s t">loopback destination (loopback_bypass, default on)</text>
<path d="M480,239 L518,239" class="s-g" stroke-width="1.6" marker-end="url(#ah-g)"/>
<rect x="520" y="226" width="416" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="532" y="242" class="xs t">allow</text>
<path d="M74,206 L74,220" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="40" y="272" width="440" height="48" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="291.2" class="s t">identity: exe key (mm-&gt;exe_file, overlay: backing file),</text>
<text x="52" y="307.2" class="s t">uid, cgroup + up to 8 ancestors → selector mask m</text>
<path d="M480,296 L518,296" class="ln" stroke-width="1.6" marker-end="url(#ah-ln)"/>
<rect x="520" y="283" width="416" height="26" rx="13" class="b-n" stroke-width="1.4"/>
<text x="532" y="299" class="xs t">m = (exe|wild_exe) &amp; (uid|wild_uid) &amp; (cg|wild_cg) &amp; sel_used</text>
<path d="M74,256 L74,270" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="40" y="346" width="440" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="366.2" class="s t">unclassified = "deny" and binary has no committed hash</text>
<path d="M480,363 L518,363" class="s-r" stroke-width="1.6" marker-end="url(#ah-r)"/>
<rect x="520" y="350" width="416" height="26" rx="13" class="b-r" stroke-width="1.4"/>
<text x="532" y="366" class="xs t">-EPERM · egress_unclassified event</text>
<path d="M74,320 L74,344" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="40" y="396" width="440" height="48" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="415.2" class="s t">kv_evaluate(egress, m, dst, port, proto)</text>
<text x="52" y="431.2" class="s t">bpf_loop over ≤1024 rules, first match wins</text>
<path d="M480,420 L518,420" class="s-r" stroke-width="1.6" marker-end="url(#ah-r)"/>
<rect x="520" y="391.5" width="416" height="57" rx="8" class="b-r" stroke-width="1.4"/>
<text x="532" y="408" class="xs t">Drop → -EPERM to the caller + event</text>
<text x="532" y="423" class="xs t">Log → allow + event · no match → default[egress]</text>
<text x="532" y="438" class="xs t">Punt → rule fail mode: closed = drop, open = log</text>
<path d="M74,380 L74,394" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="40" y="486" width="440" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="506.2" class="s t">store Identity in sk_ident (SK_STORAGE, freed with the socket)</text>
<path d="M74,444 L74,484" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<path d="M74,126 L74,170" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="24" y="566" width="912" height="166" rx="12" class="band dash" stroke-width="1.2"/>
<text x="922" y="586" class="cap c-k" text-anchor="end">TC EGRESS · KAVACH_TC_EGRESS</text>
<rect x="40" y="596" width="440" height="34" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="616.2" class="s t">flow_cache miss: insert the REPLY key {identity, gen}</text>
<path d="M480,613 L518,613" class="s-g" stroke-width="1.6" marker-end="url(#ah-g)"/>
<rect x="520" y="600" width="416" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="532" y="616" class="xs t">pass · replies now hit in O(1)</text>
<rect x="40" y="646" width="440" height="48" rx="8" class="b-k" stroke-width="1.4"/>
<text x="52" y="665.2" class="s t">hit, generation stale (policy flipped since admit):</text>
<text x="52" y="681.2" class="s t">re-evaluate with the socket's identity for the new slot</text>
<path d="M480,670 L518,670" class="s-r" stroke-width="1.6" marker-end="url(#ah-r)"/>
<rect x="520" y="649" width="416" height="42" rx="8" class="b-r" stroke-width="1.4"/>
<text x="532" y="665.5" class="xs t">still allowed → pass, entry updated</text>
<text x="532" y="680.5" class="xs t">newly denied → TC_ACT_SHOT (flow cut)</text>
<path d="M74,630 L74,644" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<path d="M74,520 L74,594" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
<rect x="40" y="744" width="440" height="32" rx="8" class="b-n" stroke-width="1.4"/>
<text x="52" y="763.2" class="s t">hit, current generation → cached verdict → NIC TX</text>
<path d="M74,700 L74,742" class="ln" stroke-width="1.3" marker-end="url(#ah-ln)"/>
</svg>
