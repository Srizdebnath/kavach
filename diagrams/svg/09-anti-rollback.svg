<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc">
<title id="title">Anti-rollback and expiry</title>
<desc id="desc">A validly signed but older bundle is still refused. Example host in fleet "prod", starting with no policy.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.h1{font-size:20px;font-weight:700}
.h2{font-size:13.5px;font-weight:650}
.b{font-size:12.5px}
.s{font-size:11.5px}
.xs{font-size:10.5px}
.bold{font-weight:650}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.dash{stroke-dasharray:5 4}
.bg{fill:#ffffff;stroke:#d0d7de}
.bgf{fill:#ffffff}
.t{fill:#1f2328}
.m{fill:#59636e}
.ln{stroke:#6e7781;fill:none}
.fln{fill:#6e7781}
.band{fill:none;stroke:#d0d7de}
.b-k{fill:#fff1e0;stroke:#c2620a}
.c-k{fill:#8a4600}
.s-k{stroke:#c2620a;fill:none}
.f-k{fill:#c2620a}
.b-u{fill:#e8f1ff;stroke:#2f6fde}
.c-u{fill:#174ea6}
.s-u{stroke:#2f6fde;fill:none}
.f-u{fill:#2f6fde}
.b-p{fill:#f2ebff;stroke:#7c4ddb}
.c-p{fill:#5a32a3}
.s-p{stroke:#7c4ddb;fill:none}
.f-p{fill:#7c4ddb}
.b-g{fill:#e6f6ec;stroke:#1f8f4e}
.c-g{fill:#116329}
.s-g{stroke:#1f8f4e;fill:none}
.f-g{fill:#1f8f4e}
.b-r{fill:#ffebee;stroke:#cf222e}
.c-r{fill:#a40e26}
.s-r{stroke:#cf222e;fill:none}
.f-r{fill:#cf222e}
.b-n{fill:#f6f8fa;stroke:#8c959f}
.c-n{fill:#424a53}
.s-n{stroke:#8c959f;fill:none}
.f-n{fill:#8c959f}
.b-y{fill:#fff8c5;stroke:#9a6700}
.c-y{fill:#7d4e00}
.s-y{stroke:#9a6700;fill:none}
.f-y{fill:#9a6700}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.bgf{fill:#0d1117}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.ln{stroke:#8b949e;fill:none}
.fln{fill:#8b949e}
.band{fill:none;stroke:#30363d}
.b-k{fill:#2a1a08;stroke:#f0883e}
.c-k{fill:#ffa657}
.s-k{stroke:#f0883e;fill:none}
.f-k{fill:#f0883e}
.b-u{fill:#0c1d36;stroke:#4493f8}
.c-u{fill:#79c0ff}
.s-u{stroke:#4493f8;fill:none}
.f-u{fill:#4493f8}
.b-p{fill:#1e1533;stroke:#a371f7}
.c-p{fill:#d2a8ff}
.s-p{stroke:#a371f7;fill:none}
.f-p{fill:#a371f7}
.b-g{fill:#0b2616;stroke:#3fb950}
.c-g{fill:#7ee787}
.s-g{stroke:#3fb950;fill:none}
.f-g{fill:#3fb950}
.b-r{fill:#2c1013;stroke:#f85149}
.c-r{fill:#ff7b72}
.s-r{stroke:#f85149;fill:none}
.f-r{fill:#f85149}
.b-n{fill:#161b22;stroke:#6e7681}
.c-n{fill:#c9d1d9}
.s-n{stroke:#6e7681;fill:none}
.f-n{fill:#6e7681}
.b-y{fill:#2b2208;stroke:#d29922}
.c-y{fill:#e3b341}
.s-y{stroke:#d29922;fill:none}
.f-y{fill:#d29922}
}
</style>
<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="619" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Anti-rollback and expiry</text>
<text x="24" y="60" class="s m">A validly signed but older bundle is still refused. Example host in fleet "prod", starting with no policy.</text>
<text x="24" y="98" class="cap m">INCOMING BUNDLE</text>
<text x="306" y="98" class="cap m">CHECK</text>
<text x="648" y="98" class="cap m">RESULT</text>
<text x="796" y="98" class="cap m">ACTIVE SERIAL AFTER</text>
<rect x="24" y="110" width="270" height="36" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="131.2" class="s t">serial 100 · fleet prod</text>
<path d="M296,128 L304,128" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="110" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="131.2" class="s t">100 &gt; active 0</text>
<rect x="648" y="115" width="136" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="716" y="131.8" class="s bold c-g" text-anchor="middle">applied</text>
<rect x="796" y="110" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="131.2" class="s mono t" text-anchor="middle">100</text>
<rect x="24" y="158" width="270" height="36" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="179.2" class="s t">serial 120</text>
<path d="M296,176 L304,176" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="158" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="179.2" class="s t">120 &gt; 100</text>
<rect x="648" y="163" width="136" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="716" y="179.8" class="s bold c-g" text-anchor="middle">applied</text>
<rect x="796" y="158" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="179.2" class="s mono t" text-anchor="middle">120</text>
<rect x="24" y="206" width="270" height="36" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="227.2" class="s t">serial 110 · old but validly signed</text>
<path d="M296,224 L304,224" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="206" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="227.2" class="s t">110 ≤ 120 → Rollback</text>
<rect x="648" y="211" width="136" height="26" rx="13" class="b-r" stroke-width="1.4"/>
<text x="716" y="227.8" class="s bold c-r" text-anchor="middle">rejected</text>
<rect x="796" y="206" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="227.2" class="s mono t" text-anchor="middle">120</text>
<rect x="24" y="254" width="270" height="36" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="275.2" class="s t">serial 120 · replayed</text>
<path d="M296,272 L304,272" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="254" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="275.2" class="s t">120 ≤ 120 → Rollback</text>
<rect x="648" y="259" width="136" height="26" rx="13" class="b-r" stroke-width="1.4"/>
<text x="716" y="275.8" class="s bold c-r" text-anchor="middle">rejected</text>
<rect x="796" y="254" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="275.2" class="s mono t" text-anchor="middle">120</text>
<rect x="24" y="302" width="270" height="36" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="323.2" class="s t">serial 130 · fleet staging</text>
<path d="M296,320 L304,320" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="302" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="323.2" class="s t">fleet ≠ prod → Fleet</text>
<rect x="648" y="307" width="136" height="26" rx="13" class="b-r" stroke-width="1.4"/>
<text x="716" y="323.8" class="s bold c-r" text-anchor="middle">rejected</text>
<rect x="796" y="302" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="323.2" class="s mono t" text-anchor="middle">120</text>
<rect x="24" y="350" width="270" height="36" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="371.2" class="s t">serial 140 · not_after passed</text>
<path d="M296,368 L304,368" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="350" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="371.2" class="s t">expired on apply → Expired</text>
<rect x="648" y="355" width="136" height="26" rx="13" class="b-r" stroke-width="1.4"/>
<text x="716" y="371.8" class="s bold c-r" text-anchor="middle">rejected</text>
<rect x="796" y="350" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="371.2" class="s mono t" text-anchor="middle">120</text>
<rect x="24" y="398" width="270" height="36" rx="8" class="b-p" stroke-width="1.4"/>
<text x="36" y="419.2" class="s t">serial 150 · signed by revoked key</text>
<path d="M296,416 L304,416" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="398" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="419.2" class="s t">key_id in revoked_keys</text>
<rect x="648" y="403" width="136" height="26" rx="13" class="b-r" stroke-width="1.4"/>
<text x="716" y="419.8" class="s bold c-r" text-anchor="middle">rejected</text>
<rect x="796" y="398" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="419.2" class="s mono t" text-anchor="middle">120</text>
<rect x="24" y="446" width="270" height="36" rx="8" class="b-u" stroke-width="1.4"/>
<text x="36" y="467.2" class="s t">kavachd restarts</text>
<path d="M296,464 L304,464" class="ln" stroke-width="1.2" marker-end="url(#ah-ln)"/>
<rect x="306" y="446" width="330" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="318" y="467.2" class="s t">re-verify active.kvb (serial not compared to itself)</text>
<rect x="648" y="451" width="136" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="716" y="467.8" class="s bold c-g" text-anchor="middle">restored</text>
<rect x="796" y="446" width="140" height="36" rx="8" class="b-n" stroke-width="1.4"/>
<text x="866" y="467.2" class="s mono t" text-anchor="middle">120</text>
<rect x="24" y="504" width="448" height="96" rx="8" class="b-n" stroke-width="1.4"/>
<text x="36" y="531.5" class="h2 c-n">where the serial comes from</text>
<text x="36" y="547.95" class="s m">kavachctl sign defaults serial to the unix time,</text>
<text x="36" y="563.95" class="s m">so each CI build is newer than the last. The active</text>
<text x="36" y="579.95" class="s m">serial is restored from /var/lib/kavach/active.kvb.</text>
<rect x="488" y="504" width="448" height="96" rx="8" class="b-y" stroke-width="1.4"/>
<text x="500" y="531.5" class="h2 c-y">expires while active</text>
<text x="500" y="547.95" class="s m">keeps enforcing and is flagged in status and</text>
<text x="500" y="563.95" class="s m">metrics: silently dropping protection would be</text>
<text x="500" y="579.95" class="s m">worse. Expired bundles are refused on apply.</text>
</svg>
