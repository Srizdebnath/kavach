<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="439" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Roadmap</text>
<text x="24" y="60" class="s m">What is built and kernel-tested today, and what is specified but not built.</text>
<path d="M60,104 L900,104" class="ln" stroke-width="2"/>
<circle cx="110" cy="104" r="7" class="b-g" stroke-width="2"/>
<rect x="24" y="124" width="172" height="292" rx="8" class="b-g" stroke-width="1.4"/>
<text x="38" y="152" class="h1 c-g">v0.1</text>
<text x="38" y="174" class="h2 t">Fast path</text>
<text x="38" y="204" class="s t">XDP blocklist (LPM trie)</text>
<text x="38" y="230" class="s t">GCRA rate limit per source</text>
<text x="38" y="256" class="s t">IPv6 budget per /64</text>
<text x="38" y="282" class="s t">native → generic fallback</text>
<text x="38" y="308" class="s t">per-reason stats, events</text>
<rect x="38" y="376" width="144" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="110" y="392.8" class="s bold c-g" text-anchor="middle">kernel-tested</text>
<circle cx="294" cy="104" r="7" class="b-g" stroke-width="2"/>
<rect x="208" y="124" width="172" height="292" rx="8" class="b-g" stroke-width="1.4"/>
<text x="222" y="152" class="h1 c-g">v0.2</text>
<text x="222" y="174" class="h2 t">Identity egress</text>
<text x="222" y="204" class="s t">BPF-LSM connect / sendmsg</text>
<text x="222" y="230" class="s t">exe sha256 · uid · cgroup</text>
<text x="222" y="256" class="s t">tamper revocation</text>
<text x="222" y="282" class="s t">trusted fs + overlay</text>
<text x="222" y="308" class="s t">flow cache + sk_ident</text>
<rect x="222" y="376" width="144" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="294" y="392.8" class="s bold c-g" text-anchor="middle">kernel-tested</text>
<circle cx="478" cy="104" r="7" class="b-g" stroke-width="2"/>
<rect x="392" y="124" width="172" height="292" rx="8" class="b-g" stroke-width="1.4"/>
<text x="406" y="152" class="h1 c-g">v0.3</text>
<text x="406" y="174" class="h2 t">Policy as code</text>
<text x="406" y="204" class="s t">kavach.toml + kavachctl</text>
<text x="406" y="230" class="s t">signed KVB1, anti-rollback</text>
<text x="406" y="256" class="s t">A/B hot-swap, audit chain</text>
<text x="406" y="282" class="s t">TLS/JA4/DNS parsers</text>
<text x="406" y="308" class="s t">doctor, .deb/.rpm, ABI pins</text>
<rect x="406" y="376" width="144" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="478" y="392.8" class="s bold c-g" text-anchor="middle">kernel-tested</text>
<circle cx="662" cy="104" r="7" class="b-y" stroke-width="2"/>
<rect x="576" y="124" width="172" height="292" rx="8" class="b-y" stroke-width="1.4"/>
<text x="590" y="152" class="h1 c-y">v0.4</text>
<text x="590" y="174" class="h2 t">Agent gateway</text>
<text x="590" y="204" class="s t">✓ MCP/A2A decision core</text>
<text x="590" y="230" class="s t">✓ kavach.ko design + stub</text>
<text x="590" y="256" class="s t">proxy + punt redirect</text>
<text x="590" y="282" class="s t">budgets, agent kill-switch</text>
<text x="590" y="308" class="s t">k8s / SPIFFE selectors</text>
<rect x="590" y="376" width="144" height="26" rx="13" class="b-y" stroke-width="1.4"/>
<text x="662" y="392.8" class="s bold c-y" text-anchor="middle">partial</text>
<circle cx="846" cy="104" r="7" class="b-n" stroke-width="2"/>
<rect x="760" y="124" width="172" height="292" rx="8" class="b-n dash" stroke-width="1.4"/>
<text x="774" y="152" class="h1 c-n">v0.5</text>
<text x="774" y="174" class="h2 t">Portability</text>
<text x="774" y="204" class="s t">FreeBSD pfil(9) shim</text>
<text x="774" y="230" class="s t">macOS Network Extension</text>
<text x="774" y="256" class="s t">Windows WFP (later)</text>
<text x="774" y="282" class="s t">same kavach-core,</text>
<text x="774" y="308" class="s t">same signed bundles</text>
<rect x="774" y="376" width="144" height="26" rx="13" class="b-n" stroke-width="1.4"/>
<text x="846" y="392.8" class="s bold c-n" text-anchor="middle">planned</text>
</svg>
