<rect x="516.3" y="441.5" width="77.4" height="15.5" rx="3" class="bgf"/>
<text x="555" y="452" class="xs c-k" text-anchor="middle">xtask codegen</text>
<rect x="513.57" y="465.5" width="82.86" height="15.5" rx="3" class="bgf"/>
<text x="555" y="476" class="xs mono c-k" text-anchor="middle">kavach_abi.h</text>
<path d="M750,112 L926,112 L926,428" class="s-k dash" stroke-width="1.6" marker-end="url(#ah-k)"/>
<rect x="768.05" y="175.5" width="151.95" height="15.5" rx="3" class="bgf"/>
<text x="917" y="186" class="xs c-k" text-anchor="end">build.rs embeds kavach.bpf.o</text>
<rect x="24" y="506" width="912" height="84" rx="8" class="b-n" stroke-width="1.4"/>
<text x="36" y="528.5" class="xs t">kavachctl and kavachd also link kavach-core (explain, differential test) and kavach-common directly; kavach-policy links kavach-common.</text>
<text x="36" y="543.5" class="xs t">kavach-parsers and kavach-gateway are standalone today (fuzzed and unit-tested) and are not yet linked into kavachd.</text>
<text x="36" y="558.5" class="xs t">The no_std crates build for a bare-metal target in CI and pass Miri, so the same core can be linked into kavach.ko and the BSD kernel.</text>
<text x="36" y="573.5" class="xs t">codegen also appends a _Static_assert per type; CI runs codegen --check. Green = no_std, dashed = planned.</text>
</svg>
