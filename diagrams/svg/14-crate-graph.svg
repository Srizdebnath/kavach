<rect x="0.5" y="0.5" width="959" height="609" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Crate and source dependency graph</text>
<text x="24" y="60" class="s m">Arrows point from a crate to what it links. The ABI has one source of truth: kavach-common.</text>
<rect x="150" y="84" width="190" height="56" rx="8" class="b-u" stroke-width="1.4"/>
<text x="245" y="107.5" class="h2 c-u" text-anchor="middle">kavachctl</text>
<text x="245" y="123.95" class="s m" text-anchor="middle">operator CLI (bin)</text>
<rect x="560" y="84" width="190" height="56" rx="8" class="b-u" stroke-width="1.4"/>
<text x="655" y="107.5" class="h2 c-u" text-anchor="middle">kavachd</text>
<text x="655" y="123.95" class="s m" text-anchor="middle">daemon (bin), tokio</text>
<rect x="40" y="210" width="190" height="56" rx="8" class="b-u" stroke-width="1.4"/>
<text x="135" y="233.5" class="h2 c-u" text-anchor="middle">kavach-api</text>
<text x="135" y="249.95" class="s m" text-anchor="middle">UDS protocol + audit chain</text>
<rect x="300" y="210" width="190" height="56" rx="8" class="b-p" stroke-width="1.4"/>
<text x="395" y="233.5" class="h2 c-p" text-anchor="middle">kavach-policy</text>
<text x="395" y="249.95" class="s m" text-anchor="middle">toml → IR, bundles, diff</text>
<rect x="600" y="210" width="190" height="56" rx="8" class="b-n" stroke-width="1.4"/>
<text x="695" y="233.5" class="h2 c-n" text-anchor="middle">aya</text>
<text x="695" y="249.95" class="s m" text-anchor="middle">external: BPF loader</text>
<rect x="300" y="320" width="190" height="56" rx="8" class="b-g" stroke-width="1.4"/>
<text x="395" y="343.5" class="h2 c-g" text-anchor="middle">kavach-core</text>
<text x="395" y="359.95" class="s m" text-anchor="middle">no_std, forbid(unsafe)</text>
<rect x="300" y="430" width="190" height="56" rx="8" class="b-g" stroke-width="1.4"/>
<text x="395" y="453.5" class="h2 c-g" text-anchor="middle">kavach-common</text>
<text x="395" y="469.95" class="s m" text-anchor="middle">no_std #[repr(C)] ABI</text>
<rect x="620" y="430" width="316" height="56" rx="8" class="b-k" stroke-width="1.4"/>
<text x="778" y="453.5" class="h2 c-k" text-anchor="middle">bpf/kavach.bpf.c</text>
<text x="778" y="469.95" class="s m" text-anchor="middle">unity build: xdp_filter · tc_flow · lsm_egress</text>
<rect x="560" y="320" width="170" height="56" rx="8" class="b-n dash" stroke-width="1.4"/>
<text x="645" y="343.5" class="h2 c-n" text-anchor="middle">kavach.ko</text>
<text x="645" y="359.95" class="s m" text-anchor="middle">kfunc core · v0.4</text>
<rect x="746" y="320" width="168" height="56" rx="8" class="b-n dash" stroke-width="1.4"/>
<text x="830" y="343.5" class="h2 c-n" text-anchor="middle">BSD / macOS shims</text>
<text x="830" y="359.95" class="s m" text-anchor="middle">v0.5 planned</text>
<rect x="40" y="320" width="190" height="56" rx="8" class="b-g" stroke-width="1.4"/>
<text x="135" y="343.5" class="h2 c-g" text-anchor="middle">kavach-parsers</text>
<text x="135" y="359.95" class="s m" text-anchor="middle">no_std TLS · JA4 · DNS</text>
<rect x="40" y="430" width="190" height="56" rx="8" class="b-u" stroke-width="1.4"/>
<text x="135" y="453.5" class="h2 c-u" text-anchor="middle">kavach-gateway</text>
<text x="135" y="469.95" class="s m" text-anchor="middle">MCP / A2A decisions</text>
