<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">Hash-chained audit log</title>
<desc id="desc">One JSON object per line in /var/log/kavach/audit.log. Every record commits to the one before it (FR-AUD-1/2).</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.h1{font-size:20px;font-weight:700}
.h2{font-size:13.5px;font-weight:650}
.b{font-size:12.5px}
.s{font-size:11.5px}
.xs{font-size:10.5px}
.bold{font-weight:650}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.dash{stroke-dasharray:5 4}
.bg{fill:#ffffff;stroke:#d0d7de}
.bgf{fill:#ffffff}
.t{fill:#1f2328}
.m{fill:#59636e}
.ln{stroke:#6e7781;fill:none}
.fln{fill:#6e7781}
.band{fill:none;stroke:#d0d7de}
.b-k{fill:#fff1e0;stroke:#c2620a}
.c-k{fill:#8a4600}
.s-k{stroke:#c2620a;fill:none}
.f-k{fill:#c2620a}
.b-u{fill:#e8f1ff;stroke:#2f6fde}
.c-u{fill:#174ea6}
.s-u{stroke:#2f6fde;fill:none}
.f-u{fill:#2f6fde}
.b-p{fill:#f2ebff;stroke:#7c4ddb}
.c-p{fill:#5a32a3}
.s-p{stroke:#7c4ddb;fill:none}
.f-p{fill:#7c4ddb}
.b-g{fill:#e6f6ec;stroke:#1f8f4e}
.c-g{fill:#116329}
.s-g{stroke:#1f8f4e;fill:none}
.f-g{fill:#1f8f4e}
.b-r{fill:#ffebee;stroke:#cf222e}
.c-r{fill:#a40e26}
.s-r{stroke:#cf222e;fill:none}
.f-r{fill:#cf222e}
.b-n{fill:#f6f8fa;stroke:#8c959f}
.c-n{fill:#424a53}
.s-n{stroke:#8c959f;fill:none}
.f-n{fill:#8c959f}
.b-y{fill:#fff8c5;stroke:#9a6700}
.c-y{fill:#7d4e00}
.s-y{stroke:#9a6700;fill:none}
.f-y{fill:#9a6700}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.bgf{fill:#0d1117}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.ln{stroke:#8b949e;fill:none}
.fln{fill:#8b949e}
.band{fill:none;stroke:#30363d}
.b-k{fill:#2a1a08;stroke:#f0883e}
.c-k{fill:#ffa657}
.s-k{stroke:#f0883e;fill:none}
.f-k{fill:#f0883e}
.b-u{fill:#0c1d36;stroke:#4493f8}
.c-u{fill:#79c0ff}
.s-u{stroke:#4493f8;fill:none}
.f-u{fill:#4493f8}
.b-p{fill:#1e1533;stroke:#a371f7}
.c-p{fill:#d2a8ff}
.s-p{stroke:#a371f7;fill:none}
.f-p{fill:#a371f7}
.b-g{fill:#0b2616;stroke:#3fb950}
.c-g{fill:#7ee787}
.s-g{stroke:#3fb950;fill:none}
.f-g{fill:#3fb950}
.b-r{fill:#2c1013;stroke:#f85149}
.c-r{fill:#ff7b72}
.s-r{stroke:#f85149;fill:none}
.f-r{fill:#f85149}
.b-n{fill:#161b22;stroke:#6e7681}
.c-n{fill:#c9d1d9}
.s-n{stroke:#6e7681;fill:none}
.f-n{fill:#6e7681}
.b-y{fill:#2b2208;stroke:#d29922}
.c-y{fill:#e3b341}
.s-y{stroke:#d29922;fill:none}
.f-y{fill:#d29922}
}
</style>
<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="469" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Hash-chained audit log</text>
<text x="24" y="60" class="s m">One JSON object per line in /var/log/kavach/audit.log. Every record commits to the one before it (FR-AUD-1/2).</text>
<rect x="24" y="100" width="120" height="150" rx="8" class="b-n" stroke-width="1.4"/>
<text x="84" y="154.5" class="h2 c-n" text-anchor="middle">genesis</text>
<text x="84" y="170.95" class="s mono t" text-anchor="middle">prev =</text>
<text x="84" y="186.95" class="s mono t" text-anchor="middle">0000…0000</text>
<text x="84" y="202.95" class="s m" text-anchor="middle">32 zero bytes</text>
<rect x="176" y="100" width="232" height="150" rx="8" class="b-g" stroke-width="1.4"/>
<text x="188" y="122" class="h2 c-g">record seq 41</text>
<text x="188" y="146" class="xs mono t" xml:space="preserve" style="white-space:pre">ts    1763811042</text>
<text x="188" y="166" class="xs mono t" xml:space="preserve" style="white-space:pre">kind  policy_apply</text>
<text x="188" y="186" class="xs mono t" xml:space="preserve" style="white-space:pre">data  {"serial":120,…}</text>
<text x="188" y="206" class="xs mono bold c-g" xml:space="preserve" style="white-space:pre">prev  7c1e…a903</text>
<text x="188" y="226" class="xs mono bold c-g" xml:space="preserve" style="white-space:pre">hash  9f2c…41be</text>
<path d="M146,202 L174,202" class="s-g" stroke-width="1.3" marker-end="url(#ah-g)"/>
<rect x="436" y="100" width="232" height="150" rx="8" class="b-g" stroke-width="1.4"/>
<text x="448" y="122" class="h2 c-g">record seq 42</text>
<text x="448" y="146" class="xs mono t" xml:space="preserve" style="white-space:pre">ts    1763811107</text>
<text x="448" y="166" class="xs mono t" xml:space="preserve" style="white-space:pre">kind  block_add</text>
<text x="448" y="186" class="xs mono t" xml:space="preserve" style="white-space:pre">data  {"cidr":"203.0…"}</text>
<text x="448" y="206" class="xs mono bold c-g" xml:space="preserve" style="white-space:pre">prev  9f2c…41be</text>
<text x="448" y="226" class="xs mono bold c-g" xml:space="preserve" style="white-space:pre">hash  4be1…d07a</text>
<path d="M410,222 L422,222 L422,202 L434,202" class="s-g" stroke-width="1.3" marker-end="url(#ah-g)"/>
<rect x="696" y="100" width="232" height="150" rx="8" class="b-g" stroke-width="1.4"/>
<text x="708" y="122" class="h2 c-g">record seq 43</text>
<text x="708" y="146" class="xs mono t" xml:space="preserve" style="white-space:pre">ts    1763811260</text>
<text x="708" y="166" class="xs mono t" xml:space="preserve" style="white-space:pre">kind  verdict</text>
<text x="708" y="186" class="xs mono t" xml:space="preserve" style="white-space:pre">data  {"egress drop",…}</text>
<text x="708" y="206" class="xs mono bold c-g" xml:space="preserve" style="white-space:pre">prev  4be1…d07a</text>
<text x="708" y="226" class="xs mono bold c-g" xml:space="preserve" style="white-space:pre">hash  e05d…8c12</text>
<path d="M670,222 L682,222 L682,202 L694,202" class="s-g" stroke-width="1.3" marker-end="url(#ah-g)"/>
<rect x="24" y="270" width="912" height="44" rx="8" class="b-p" stroke-width="1.4"/>
<text x="480" y="295.2" class="s mono t" text-anchor="middle">hash_n = SHA-256( prev_hash_bytes ‖ canonical_json({seq, ts, kind, data}) )</text>
<text x="24" y="344" class="cap m">WHAT KAVACHCTL AUDIT CATCHES</text>
<rect x="24" y="356" width="300" height="50" rx="8" class="b-r" stroke-width="1.4"/>
<text x="174" y="376.5" class="h2 c-r" text-anchor="middle">edit a record</text>
<text x="174" y="392.95" class="s m" text-anchor="middle">hash mismatch at that line → Chain</text>
<rect x="330" y="356" width="300" height="50" rx="8" class="b-r" stroke-width="1.4"/>
<text x="480" y="376.5" class="h2 c-r" text-anchor="middle">delete · insert · reorder</text>
<text x="480" y="392.95" class="s m" text-anchor="middle">seq gap at that line → Sequence</text>
<rect x="636" y="356" width="300" height="50" rx="8" class="b-y" stroke-width="1.4"/>
<text x="786" y="376.5" class="h2 c-y" text-anchor="middle">broken log at startup</text>
<text x="786" y="392.95" class="s m" text-anchor="middle">rotated aside, never extended</text>
<text x="24" y="434" class="xs m">Record kinds: policy_apply · block_add / block_del · ratelimit / ratelimit_off · kill_switch · exe_tainted ·</text>
<text x="24" y="450" class="xs m">task_restart · verdict (sampled drops, ≤10/s). Ship the file to a SIEM; any verifier can recompute the chain.</text>
</svg>
