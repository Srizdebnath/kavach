<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 472" width="960" height="472" role="img" aria-labelledby="title desc">
<title id="title">Atomic A/B hot-swap</title>
<desc id="desc">Two policy slots in the kernel. kavachd fills the idle one, flips one integer, then waits out an RCU grace period.</desc>
<style>
text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;}
.h1{font-size:20px;font-weight:700}
.h2{font-size:13.5px;font-weight:650}
.b{font-size:12.5px}
.s{font-size:11.5px}
.xs{font-size:10.5px}
.bold{font-weight:650}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.dash{stroke-dasharray:5 4}
.bg{fill:#ffffff;stroke:#d0d7de}
.bgf{fill:#ffffff}
.t{fill:#1f2328}
.m{fill:#59636e}
.ln{stroke:#6e7781;fill:none}
.fln{fill:#6e7781}
.band{fill:none;stroke:#d0d7de}
.b-k{fill:#fff1e0;stroke:#c2620a}
.c-k{fill:#8a4600}
.s-k{stroke:#c2620a;fill:none}
.f-k{fill:#c2620a}
.b-u{fill:#e8f1ff;stroke:#2f6fde}
.c-u{fill:#174ea6}
.s-u{stroke:#2f6fde;fill:none}
.f-u{fill:#2f6fde}
.b-p{fill:#f2ebff;stroke:#7c4ddb}
.c-p{fill:#5a32a3}
.s-p{stroke:#7c4ddb;fill:none}
.f-p{fill:#7c4ddb}
.b-g{fill:#e6f6ec;stroke:#1f8f4e}
.c-g{fill:#116329}
.s-g{stroke:#1f8f4e;fill:none}
.f-g{fill:#1f8f4e}
.b-r{fill:#ffebee;stroke:#cf222e}
.c-r{fill:#a40e26}
.s-r{stroke:#cf222e;fill:none}
.f-r{fill:#cf222e}
.b-n{fill:#f6f8fa;stroke:#8c959f}
.c-n{fill:#424a53}
.s-n{stroke:#8c959f;fill:none}
.f-n{fill:#8c959f}
.b-y{fill:#fff8c5;stroke:#9a6700}
.c-y{fill:#7d4e00}
.s-y{stroke:#9a6700;fill:none}
.f-y{fill:#9a6700}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}
.bgf{fill:#0d1117}
.t{fill:#e6edf3}
.m{fill:#9198a1}
.ln{stroke:#8b949e;fill:none}
.fln{fill:#8b949e}
.band{fill:none;stroke:#30363d}
.b-k{fill:#2a1a08;stroke:#f0883e}
.c-k{fill:#ffa657}
.s-k{stroke:#f0883e;fill:none}
.f-k{fill:#f0883e}
.b-u{fill:#0c1d36;stroke:#4493f8}
.c-u{fill:#79c0ff}
.s-u{stroke:#4493f8;fill:none}
.f-u{fill:#4493f8}
.b-p{fill:#1e1533;stroke:#a371f7}
.c-p{fill:#d2a8ff}
.s-p{stroke:#a371f7;fill:none}
.f-p{fill:#a371f7}
.b-g{fill:#0b2616;stroke:#3fb950}
.c-g{fill:#7ee787}
.s-g{stroke:#3fb950;fill:none}
.f-g{fill:#3fb950}
.b-r{fill:#2c1013;stroke:#f85149}
.c-r{fill:#ff7b72}
.s-r{stroke:#f85149;fill:none}
.f-r{fill:#f85149}
.b-n{fill:#161b22;stroke:#6e7681}
.c-n{fill:#c9d1d9}
.s-n{stroke:#6e7681;fill:none}
.f-n{fill:#6e7681}
.b-y{fill:#2b2208;stroke:#d29922}
.c-y{fill:#e3b341}
.s-y{stroke:#d29922;fill:none}
.f-y{fill:#d29922}
}
</style>
<defs>
<marker id="ah-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-k"/></marker>
<marker id="ah-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-u"/></marker>
<marker id="ah-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-p"/></marker>
<marker id="ah-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-g"/></marker>
<marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-r"/></marker>
<marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-n"/></marker>
<marker id="ah-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-y"/></marker>
<marker id="ah-ln" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fln"/></marker>
</defs>
<rect x="0.5" y="0.5" width="959" height="471" rx="14" class="bg"/>
<text x="24" y="38" class="h1 t">Atomic A/B hot-swap</text>
<text x="24" y="60" class="s m">Two policy slots in the kernel. kavachd fills the idle one, flips one integer, then waits out an RCU grace period.</text>
<text x="358" y="98" class="s bold m" text-anchor="middle">① stage the inactive slot</text>
<text x="585" y="98" class="s bold m" text-anchor="middle">② flip · ③ drain</text>
<text x="793" y="98" class="s bold m" text-anchor="middle">④ steady state</text>
<path d="M520,106 L520,392" class="s-p dash" stroke-width="1.6"/>
<path d="M650,106 L650,392" class="ln dash" stroke-width="1"/>
<text x="24" y="137" class="s bold t">policy_slots[0] · A</text>
<rect x="198" y="116" width="320" height="32" rx="6" class="b-g" stroke-width="1.4"/>
<text x="358" y="135" class="xs t" text-anchor="middle">active · gen 6</text>
<rect x="522" y="116" width="126" height="32" rx="6" class="b-y" stroke-width="1.4"/>
<text x="585" y="135" class="xs t" text-anchor="middle">in-flight only</text>
<rect x="652" y="116" width="282" height="32" rx="6" class="b-n" stroke-width="1.4"/>
<text x="793" y="135" class="xs t" text-anchor="middle">idle → next stage target</text>
<text x="24" y="187" class="s bold t">policy_slots[1] · B</text>
<rect x="198" y="166" width="50" height="32" rx="6" class="b-n" stroke-width="1.4"/>
<text x="223" y="185" class="xs t" text-anchor="middle">idle</text>
<rect x="252" y="166" width="266" height="32" rx="6" class="b-p" stroke-width="1.4"/>
<text x="385" y="185" class="xs t" text-anchor="middle">writing classes, addr_sets, Policy</text>
<rect x="522" y="166" width="412" height="32" rx="6" class="b-g" stroke-width="1.4"/>
<text x="728" y="185" class="xs t" text-anchor="middle">active · gen 7</text>
<text x="24" y="237" class="s bold t">policy_gen</text>
<rect x="198" y="216" width="320" height="32" rx="6" class="b-n" stroke-width="1.4"/>
<text x="358" y="235" class="xs t" text-anchor="middle" xml:space="preserve" style="white-space:pre">6   → slot = 6 &amp; 1 = A</text>
<rect x="522" y="216" width="412" height="32" rx="6" class="b-n" stroke-width="1.4"/>
<text x="728" y="235" class="xs t" text-anchor="middle" xml:space="preserve" style="white-space:pre">7   → slot = 7 &amp; 1 = B</text>
<text x="24" y="337" class="s bold t">flow_cache</text>
<rect x="198" y="316" width="320" height="32" rx="6" class="b-n" stroke-width="1.4"/>
<text x="358" y="335" class="xs t" text-anchor="middle">entries stamped gen 6</text>
<rect x="522" y="316" width="412" height="32" rx="6" class="b-y" stroke-width="1.4"/>
<text x="728" y="335" class="xs t" text-anchor="middle">gen-6 entry hit → stale → re-evaluated, re-stamped 7</text>
<text x="24" y="287" class="s bold t">BPF programs</text>
<rect x="214" y="270" width="92" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="260" y="286.8" class="xs bold c-g" text-anchor="middle">read 6 → A</text>
<rect x="320" y="270" width="92" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="366" y="286.8" class="xs bold c-g" text-anchor="middle">read 6 → A</text>
<rect x="470" y="270" width="112" height="26" rx="13" class="b-y" stroke-width="1.4"/>
<text x="526" y="286.8" class="xs bold c-y" text-anchor="middle">read 6 → stays A</text>
<rect x="600" y="270" width="92" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="646" y="286.8" class="xs bold c-g" text-anchor="middle">read 7 → B</text>
<rect x="730" y="270" width="92" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="776" y="286.8" class="xs bold c-g" text-anchor="middle">read 7 → B</text>
<rect x="840" y="270" width="92" height="26" rx="13" class="b-g" stroke-width="1.4"/>
<text x="886" y="286.8" class="xs bold c-g" text-anchor="middle">read 7 → B</text>
<rect x="461.14" y="252.5" width="117.72" height="15.5" rx="3" class="bgf"/>
<text x="520" y="263" class="xs bold c-p" text-anchor="middle">flip: one 32-bit write</text>
<path d="M522,372 L648,372" class="s-k" stroke-width="1.3" marker-end="url(#ah-k)" marker-start="url(#ah-k)"/>
<rect x="537.27" y="355.5" width="95.46" height="15.5" rx="3" class="bgf"/>
<text x="585" y="366" class="xs c-k" text-anchor="middle">synchronize_rcu()</text>
<rect x="24" y="400" width="912" height="56" rx="8" class="b-n" stroke-width="1.4"/>
<text x="36" y="423.5" class="xs t">Each invocation reads policy_gen once and uses slot = gen &amp; 1 for every lookup: no packet or connect() sees half of two policies (FR-HS-2).</text>
<text x="36" y="438.5" class="xs t">Established flows the new policy still allows keep flowing; newly denied ones are cut on their next packet at TC egress (FR-HS-4/5).</text>
</svg>
